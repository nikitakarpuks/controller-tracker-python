data:
  root: "/home/nikitakarpuks/Downloads/recordings-aug26/euroc_recording_20260826173103_static_dark/mav0"
  layout: "per_camera_folders"  # "concatenated" = one folder, every camera's view packed
                           # side-by-side into a single wide image per frame (uses
                           # img_width/total_cameras_number below to slice per camera).
                           # "per_camera_folders" = one subfolder per camera under root,
                           # each holding the same number of images; frames are paired
                           # by sorted position within each folder (filenames need not
                           # match across folders). Uses camera_folder_pattern /
                           # images_subdir below instead of img_width/total_cameras_number.
  camera_folder_pattern: "cam{idx}"  # only used when layout is "per_camera_folders";
                                      # {idx} is replaced with the camera index (after
                                      # controller_cam_start_index below is applied)
  controller_cam_start_index: 4  # on-disk folder offset for controller cameras: recordings that
                                  # also capture SLAM data pack SLAM cams in cam0..cam{N-1} and
                                  # controller-tracking cams in cam{N}..cam{2N-1}; this pipeline
                                  # only ever tracks controllers, so selected_cameras/calibration/
                                  # etc. all keep 0-based internal indexing and only the folder
                                  # lookup is shifted (cam{idx} -> cam{idx + this}). 0 = controller
                                  # folders already start at cam0 (no offset).
  images_subdir: "data"  # only used when layout is "per_camera_folders"; optional subfolder
                      # inside each camera folder holding the images, e.g. "data" for an
                      # EuRoC-style root/cam0/data/*.png layout; "" if images sit directly
                      # in the camera folder
  img_width: 2560
  img_height: 481
  has_technical_row: true  # first pixel row encodes exposure/gain; set false if the row is absent
  total_cameras_number: 4
  selected_cameras: [0, 1, 2, 3] # choose any sequential cameras, max list is [0, 1, 2, 3]
  frame_range:
    lower: null  # inclusive, 0-based index into the alphabetically-sorted image list
                 # (each camera folder in "per_camera_folders" layout); null = start
                 # from the first image
    upper: null  # exclusive index; null = no upper limit. E.g. lower: 100, upper: 200
                 # processes images at sorted positions 100..199 only.

fusion_heuristic:
  # Only read when fusion.filter_type: heuristic. See src/pose_fusion_heuristic.py
  # (HeuristicPoseFusionFilter). Every vision solution is fused (no hard
  # gating) by minimizing J(p) = cost_weight_imu*||p-p_imu||^2 +
  # w_vision*||p-p_vision||^2 + cost_weight_smooth*||p-p_prev||^2 -- closed-
  # form minimizer is a weighted average of the three candidates (rotation
  # uses the same weights on tangent-space error vectors).
  cost_weight_imu: 1.0        # pulls the fused pose toward the IMU dead-reckoned prediction
  cost_weight_smooth: 0.5     # pulls the fused pose toward the previous fused state (temporal smoothing)
  trust_window_len: 5         # rolling window of recent accepted-frame confidences, used by trust_score()/trust()

  # w_vision is NOT a fixed constant like the two above -- see
  # HeuristicPoseFusionFilter._vision_weight. cost_weight_vision below is
  # its BASE (full-trust) value; the four thresholds after it scale that
  # base down for a weak match (few matched LEDs and/or high mean
  # reprojection error this frame) via two independent linear ramps that
  # AVERAGE together (not multiply -- a strict product was tried first and
  # found to zero the WHOLE vision weight whenever either axis alone
  # saturated to 0, even with the other at a perfect 1.0; confirmed on
  # this recording both ways -- see _vision_weight's docstring).
  cost_weight_vision: 2.0     # base/max vision weight (full trust -- match is strong on both axes)

  # n_inliers axis: total matched LED-blob pairs this frame, across every
  # camera that contributed (primary + aux) -- 0 weight at/below
  # vision_weight_weak_inliers, full weight at/above vision_weight_strong_
  # inliers, linear in between. Shared across controllers -- unlike
  # error_px below, this recording's own n_inliers distribution is
  # essentially the same for both (frames 0-1000, data/vision_pose_log.csv:
  # left p50=15/p90=19, right p50=15/p90=19).
  vision_weight_weak_inliers: 5       # just above matching.min_inliers (4) -- a solve that barely
  vision_weight_strong_inliers: 8    # cleared pose_search's own floor still gets SOME credit rather
                                      # than none. strong=18 sits at both controllers' own ~p75-p90.

  # error_px axis: this frame's own mean reprojection error (solution["error"],
  # already the FUSED multi-camera value) -- full weight at/below
  # vision_weight_strong_error_px, 0 weight at/above vision_weight_weak_error_px,
  # linear in between (note the direction: LOWER error is better). These
  # are the LEFT-controller-shaped defaults (own p50=0.25/p90=0.39) --
  # right_controller runs meaningfully higher error across this whole
  # recording (own p50=0.49/p90=1.04) and gets its own override below, so
  # its normal frames don't get starved of vision trust the way they were
  # before this override existed (root cause of "vision has small error
  # but the fused pose doesn't move" on right_controller).
  vision_weight_weak_error_px: 0.5
  vision_weight_strong_error_px: 0.15

  # Hard implausibility gate (see HeuristicPoseFusionFilter._vision_weight's
  # own docstring) -- a vision candidate whose position/rotation jump vs the
  # IMU prediction exceeds EITHER of these gets vision weight forced to 0
  # outright, regardless of how good n_inliers/error_px look. Added after a
  # real identity-swap on this recording: right_controller's vision landed on
  # left_controller's own tracked position (998mm/125.5deg jump) with only
  # n_inliers=6 but a deceptively clean error=0.13px -- the two ramps above
  # alone still gave it vision share=0.40, corrupting the fused anchor by
  # ~40% of a full 1m jump in one frame, which every subsequent IMU-only-
  # propagated frame then correctly coasted from (looked like "many frames
  # of nonsense" but was really one bad frame poisoning the anchor). 0.3m
  # is well above any normal per-frame innovation seen in this recording's
  # own real motion (typically <70mm even during fast hand motion -- see
  # FUSED debug lines); 60deg similarly well above normal rotation innovation.
  implausible_jump_pos_m: 0.3
  implausible_jump_rot_deg: 60.0

  # Long-gap damping (see HeuristicPoseFusionFilter._gap_scale_factors) -- scales
  # w_vision down and w_smooth up as the elapsed gap since the last accepted
  # update (dt_s) grows, on top of the inlier/error ramps above. Added after a
  # real jump on this recording: a frame landing right after two rejected
  # frames (dt=66.6ms) had a weak match (n_inliers=6) but a deceptively clean
  # error=0.05px, earning vision_share=0.40 (tied with IMU) and producing a
  # ~115mm single-step jump vs. the ~3-7mm/frame typical of stable tracking --
  # the inlier/error ramps alone have no notion of how long the IMU side has
  # been dead-reckoning unconstrained. Below gap_dt_normal_s this is a no-op
  # (both scales are 1.0); linearly ramps to the floor/boost values below by
  # gap_dt_full_s. First-cut defaults, not yet validated against a wider
  # sample of this recording's own gap distribution.
  gap_dt_normal_s: 0.04         # same cadence cutoff as PoseFusionFilter's _WARM_FRAME_DT_CUTOFF_S
  gap_dt_full_s: 0.15           # full damping applies at/above this elapsed gap
  gap_vision_weight_floor: 0.3  # w_vision multiplier at/beyond gap_dt_full_s (1.0 = no damping)
  gap_smooth_weight_boost: 2.5  # w_smooth multiplier at/beyond gap_dt_full_s (1.0 = no boost)

  # Per-controller overrides -- see HeuristicPoseFusionFilter._hc_get.
  # Any key from fusion_heuristic: above can be overridden here per
  # ctrl_name; anything not listed for a controller falls back to the
  # shared value above it.
  per_controller:
    right_controller:
      vision_weight_weak_error_px: 1.1    # right's own p90~1.04/p95~1.12 (frames 0-1000) --
      vision_weight_strong_error_px: 0.2  # p10~0.14 -- own typical range runs higher than left's.


imu:
  enabled: true  # off while the real IMU+vision fusion filter is being built separately
                  # (offline, against pose_csv + raw imu*.csv + mocap) -- keep live tracking
                  # on pure vision + linear extrapolation until the new filter is validated,
                  # rather than run both prediction mechanisms at once. Stage 3: fold
                  # controller gyro into pose prediction + run the gravity-alignment
                  # diagnostic (log-only). Requires
                  # <data.root>/imu1/data.csv (left) and imu2/data.csv (right) in
                  # EuRoC format; falls back to pure vision-history prediction
                  # (with a startup warning) if a file is missing.

fusion:
  enabled: true  # master switch; false = today's behavior exactly -- raw vision solve
                  # reported every frame, no smoothing, no IMU-based gating. See
                  # src/pose_fusion.py (PoseFusionFilter) for the mechanism this
                  # unlocks. Requires imu.enabled: true to have any real IMU-based
                  # prediction/gating -- fails open (behaves as if disabled) otherwise.
  filter_type: heuristic  # kalman | heuristic. kalman = src/pose_fusion.py's PoseFusionFilter
                  # (covariance/chi2-gate based). heuristic = src/pose_fusion_heuristic.py's
                  # HeuristicPoseFusionFilter -- a plain 3-term weighted-cost fusion (IMU
                  # prediction, vision measurement, previous-state smoothing), no gating, no
                  # self-calibration; see fusion_heuristic: below. Shared keys (max_coast_s,
                  # max_consecutive_rejects, trust_gap_tau_s, g_world_min_samples,
                  # g_world_low_omega_thresh_rad_s, all in this block) are read by BOTH filter
                  # types; everything else in fusion: below is kalman-only.
  max_coast_s: 0.3                    # force cold-start once this long has elapsed with no accepted update
  max_consecutive_rejects: 5          # force cold-start after this many implausible-in-a-row rejections
  imu_vision_collision_dist_m: 0.05   # cross-controller check, read by main.py directly (not either filter
                                       # class) -- two controllers are separate rigid bodies and cannot
                                       # physically share a tracked origin. If a controller with NO real vision
                                       # this frame (full occlusion, or a fusion-rejected candidate -- either
                                       # way its displayed pose is the filter's own IMU-only prediction) ends
                                       # up within this distance of a DIFFERENT controller that DOES have a
                                       # real accepted vision update this frame, the IMU-only one is dropped
                                       # (hidden, same as tracking-lost) and its fusion filter/camera priors
                                       # are force-reset, rather than showing two interpenetrating controller
                                       # meshes. Only fires when exactly one side is vision-backed -- two
                                       # simultaneously-coasting controllers overlapping isn't resolved here
                                       # (neither side is more trustworthy). 0.05m is well under any real
                                       # controller-to-controller separation seen in this recording's own
                                       # motion, comfortably above the ~1-3cm seen in this project's own
                                       # documented identity-swap cases (see fusion_heuristic's implausible_
                                       # jump_pos_m comment) -- tune per-recording if controllers legitimately
                                       # come this close together (e.g. a two-handed grip).
  process_noise_pos_m_per_s: 0.6      # error-covariance growth rate, position -- sized to this recording's
                                       # real p90 frame-to-frame speed (data/vision_pose_log.csv: right
                                       # p50=0.34 p90=0.56 p99=0.83 m/s, left p50=0.30 p90=0.48 p99=0.58 m/s).
                                       # Old 0.3 sat at the MEDIAN, so half of all real motion already
                                       # exceeded what the filter expected -- harmless while measurement
                                       # noise was oversized (loose gate absorbed it), but caused false
                                       # gated_reject/coast cycles once meas_*_sigma below was tightened to
                                       # match real vision precision.
  process_noise_rot_deg_per_s: 250.0  # same reasoning, rotation: real p90 ~244-246 deg/s (p50 ~132-135,
                                       # p99 ~384-446). Old 20.0 was 6-7x below the MEDIAN real rate, not
                                       # just p90 -- the single largest contributor to the false-reject
                                       # cascade above (d2's rotation terms dominated the blowout).
  gate_chi2_threshold: 7.8            # Mahalanobis accept gate, ~95% for 3 dof; tune during validation
                                       # (NOTE: try_update's own d2 sums 6 terms -- 3 pos + 3 rot -- so this
                                       # threshold is actually stricter than its "~95%" comment claims for
                                       # that 6-dof sum; pre-existing from Phase 1, not touched here)
  absolute_reject_pos_m: 0.08         # SECOND, independent reject check (OR'd with gate_chi2_threshold above):
                                       # a warm-frame (see PoseFusionFilter._WARM_FRAME_DT_CUTOFF_S) position
                                       # innovation beyond this is an immediate reject even if d2 alone would
                                       # pass (e.g. right after a coast, when P_pred is loose) -- catches an
                                       # identity-swapped candidate (a real position, just the WRONG
                                       # controller's) that would otherwise sneak through.
                                       # Raised from 0.03 (2026-09-04): once measurement noise was tuned
                                       # looser for real smoothing (meas_base_pos_sigma_m etc. above), the
                                       # filter's own prediction legitimately lags fast real motion more than
                                       # it used to -- confirmed a genuine (non-swap) frame with d2=0.015
                                       # (statistically unsurprising given the filter's own P_pred) but a
                                       # 32.95mm predicted-vs-vision innovation, tripping the old 0.03m cutoff
                                       # and firing the sibling cross-reset escape hatch (controller.py
                                       # ~1625-1656) on a healthy sibling controller -- this project's own
                                       # "frames 231-241" regression. 0.08m keeps >2x margin above that
                                       # observed false positive while staying well under this recording's
                                       # minimum real inter-controller separation (168mm, data/vision_pose_
                                       # log.csv), so genuine identity swaps are still caught.
  bootstrap_cross_ctrl_gate_chi2_threshold: 7.8  # position-only (3 dof, so 7.8 IS the real ~95% point here) --
                                       # gates PoseFusionFilter.try_update's bootstrap branch against every
                                       # OTHER enabled controller's own still-live prediction, catching a fresh
                                       # candidate that looks like it's actually a SIBLING controller (an
                                       # identity swap at cold reacquisition) before trusting it -- see
                                       # src/pose_fusion.py's _looks_like_a_sibling. No effect on a controller
                                       # that already has live state; that case still uses gate_chi2_threshold
                                       # above via the normal per-controller predict()/gate.
  trust_window_len: 5                 # rolling window of recent GATED-accept (comfort, confidence) pairs used
                                       # by PoseFusionFilter.trust_score() -- populated ONLY on a real gated
                                       # correction accept, not bootstrap/fail-open, so a freshly-(re)bootstrapped
                                       # filter starts with trust_score()==0 until proven. See src/pose_fusion.py.
  trust_gap_tau_s: 0.45               # exp(-dt/tau) decay in trust() for elapsed time since a filter's own
                                       # last accepted update -- an explicit factor beyond P's own covariance
                                       # growth. Calibrated against this dataset's real gap-vs-drift data: IMU
                                       # dead-reckoning error stays ~0.3-0.7m through ~0.8s gaps then cliffs to
                                       # 6x+ actual displacement by ~1.3s (visualization/pose_fusion_phase5_trust_signal.html).
  sibling_trust_min: 0.4              # _looks_like_a_sibling only uses a sibling's prediction as a cross-check
                                       # reference when the sibling's OWN trust() clears this -- closes the
                                       # Phase 4/Option-B gap where a live-but-silently-drifted sibling was
                                       # trusted as ground truth. Does NOT help when both controllers are
                                       # simultaneously untrustworthy after a long shared occlusion -- see
                                       # trust()'s docstring.
  initial_pos_sigma_m: 0.02
  initial_rot_sigma_deg: 2.0
  initial_vel_sigma_m_per_s: 0.1
  meas_base_pos_sigma_m: 0.015
  meas_error_px_to_m: 0.003
  meas_base_rot_sigma_deg: 2.0
  long_gap_reacquire_s: 0.08          # once elapsed time since the last accepted update reaches this
                                       # (~5 missed frames at this recording's real ~16.6ms median cadence),
                                       # the per-axis Kalman gain is floored at long_gap_min_vision_trust
                                       # below -- a decisive fusion-DECISION override, not a monitoring
                                       # signal: without it, a low-confidence brute recovery after a long
                                       # blind gap can land the gain around ~0.4 (confidence-inflated R
                                       # comparable to P_pred's own growth), keeping ~60% weight on a
                                       # prediction that was dead-reckoning blind the whole gap. trust_score()/
                                       # trust_window_len never enter this correction at all -- separate
                                       # mechanism (sibling cross-check + reporting only).
  long_gap_min_vision_trust: 0.9      # minimum per-axis gain applied once long_gap_reacquire_s is reached --
                                       # 0.9 = IMU prediction keeps at most ~10% weight in the correction
                                       # ("very little impact"), not zero -- still a blend, not a forced
                                       # re-bootstrap.
  # A low-reprojection-error trust floor (mirroring long_gap_* above) was tried
  # here TWICE (2026-09-04) and REVERTED both times -- it depended on a
  # companion change to ControllerTracker._commit_fused_solution (search-time
  # pose_history seeded from raw vision, not the fused pose, on accepted
  # updates) that an adversarial mocap-validated audit found caused a severe
  # regression elsewhere in the recording (~600ms/840mm mistrack). That
  # companion change was reverted too -- see src/pose_fusion.py's try_update
  # and src/controller.py's _commit_fused_solution for the full account. Don't
  # re-add either piece alone.
  g_world_min_samples: 20
  g_world_low_omega_thresh_rad_s: 2.0

mocap:
  enabled: true  # load per-device mocap ground truth (see src/mocap_data.py) from
                  # <data.root's parent>/mocap_filtered/{headset,ctrlleft,ctrlright}/
                  # (sibling to mav0/, not inside it) -- requires each enabled
                  # device's mocap_calib_path below to be set; falls back to no
                  # ground truth (with a startup warning) if a device's files are
                  # missing. Only used for debug.mocap_log_dir's export for now.
  max_interp_gap_ms: 30.0  # a query timestamp whose two bracketing real mocap samples are
                  # farther apart than this is treated as "no ground truth here" (returns
                  # None) rather than interpolated across -- guards against gaps left by
                  # motive_to_gt.py DROPPING (not blanking) N/A/high-error/implausible-jump
                  # frames, which can leave much larger gaps than the nominal ~8.3ms mocap
                  # cadence during real marker occlusion (158ms gaps confirmed on real data).

