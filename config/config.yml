geometry:
  z_frustum_top_padding: 0.0045   # metres added above the topmost outer LED axial position
  z_frustum_bot_padding: 0.0055   # metres subtracted below the bottommost outer LED axial position
  wall_thickness: 0.007           # frustum wall thickness in metres (R_fc_inner = R_fc - wall_thickness)


blob_detection:

  # ── Common (both warm and cold paths) ────────────────────────────────────
  # visualize_save / visualize_rerun live under visualization: below, next to
  # `enabled` — all viewer/debug-output toggles kept in one place.
  min_threshold: 6                  # pixels >= this are included in a blob
  min_area: 2
  max_area: 500
  min_split_dist: 4.0
  split_valley_ratio: 0.6           # saddle_min/lower_peak must be below this to allow splitting
  min_circularity: 0.4              # 4π·area/perimeter² must exceed this; rejects elongated shapes
  # Motion-blur "tail" rescue: a circularity-failed blob is kept anyway if its
  # own minAreaRect shape (long/short side ratio + fill of that rect) matches
  # a genuine LED streak instead of some other non-circular artifact. When the
  # lamp-fixture line-finder is in scope (see lamp_blob_filter below), a
  # streak-shaped blob is additionally required to NOT have been swept into a
  # line detect_lamp_blobs actually recognized+removed -- on this project's
  # own recordings, some individual (non-merged) lamp elements are themselves
  # naturally elongated ovals, indistinguishable from a real streak by shape
  # alone; see _looks_like_motion_streak's own callers in src/blob_detector.py
  # for the full mechanism.
  #
  # Values derived 2026-09-12 from real cold-detect circularity-reject logging
  # (probe_streak_elongation.py, not committed) over frames 3890-3894 cam0+1
  # (confirmed fast-motion LED tails, visually verified genuine on every
  # sampled blob): elongation 2.11-4.43, fill_ratio 0.343-0.666 across 41
  # real streaks. Cross-checked against cam3 frames 600-700's known lamp
  # fixture population (both the multi-bead chain and the merged-row blob,
  # tests/test_lamp_pass2_merged_blob_context.py's own real-recording
  # reference): the line-context check above correctly excludes both those
  # classes at these thresholds. Residual accepted risk: a handful of tiny
  # (<10px) blobs from a THIRD, more widely-spaced real ceiling structure on
  # cam3 still get rescued, since its own point spacing exceeds
  # lamp_blob_filter.spacing_max_px (25px at the time this was accepted,
  # since raised to 32px 2026-09-13 -- itself a deliberately-tuned, jointly
  # re-validated-with-min_points safety bound against controller-ring
  # geometry, not to be casually widened further -- see spacing_max_px's own
  # comment) so detect_lamp_blobs never recognizes it as a line at all; not
  # observed on cam0/cam1. Re-check this residual-risk call if that third
  # structure's own spacing turns out to fall inside the new 32px bound.
  # Accepted 2026-09-12: isolated spurious blobs like these are exactly what
  # brute-force matching's own geometric consistency check is the backstop
  # for (see lamp_blob_filter.py's module docstring).
  min_streak_elongation: 2.0
  max_streak_elongation: 4.5
  min_streak_fill_ratio: 0.30
  min_circularity_angle_factor: 0.2
  min_circularity_floor: 0.1
  required_threshold_factor: 2.0   # required_threshold = clip(pixel_threshold * factor, 255)
  # threshold_scale = 1/(1 + k*v_px), floored at velocity_threshold_min_factor.
  # With warm_strategy: "fit", it relaxes _detect_blobs_local's per-LED
  # pixel_thrs. With warm_strategy: "hybrid" (active), it instead relaxes
  # required_threshold (the dim-blob rejection floor, never pixel_threshold
  # itself) for the hybrid warm pass -- see BlobDetector.detect's own
  # has_prior block -- so a fast-moving controller's real, motion-blurred
  # (lower peak brightness) LEDs aren't dropped as "too dim". 0 = disabled
  # (threshold_scale stays 1.0, a no-op either way).
  velocity_threshold_k: 0.013          # scale = 1/(1 + k*v_px); lowers threshold at speed; 0 = disabled
  velocity_threshold_min_factor: 0.75  # floor: threshold never drops below this fraction of base

  # ── Warm path (active when a predicted pose is available) ─────────────────
  warm_strategy: "hybrid"    # "fit" = per-LED pose_guided_thresholds model (below);
                          # "hybrid" = cold-style stats-based 2-pass detection
                          # (see Cold path pass 1/2 settings below), scoped to
                          # the union of predicted-LED search neighborhoods
                          # instead of the full frame
  pose_guided_thresholds:
    max_area:
      # cos-free: area-vs-angle calibration data showed no reliable trend (noise
      # across all facing_cos values), unlike the clean inverse-square depth fit —
      # values below from MANUAL_AB=(0.8, 25) verification in fit_max_area.py with
      # USE_FACING_COS=False; re-run that script's auto-fit (MANUAL_AB=None) for a
      # precise lstsq value once more calibration data is collected.
      use_facing_cos: false
      a: 1.2
      b: 40
      c: 0.5

#    # Formula: threshold = a * facing_cos / depth_m² + c * velocity_px + b
#    #   a  — scales the Lambertian + inverse-square physics term
#    #   c  — velocity coefficient (per px/frame of controller motion); 0 = no
#    #        effect, omit or leave at 0 until calibrated from calibration_csv
#    #        data (previously velocity was only handled by the separate
#    #        velocity_threshold_k/threshold_scale relaxation below, which is
#    #        now floor-limited at min_threshold and largely inert for this path)
#    #   b  — constant floor independent of geometry (noise baseline)
#    pixel_threshold:
#      a: 0.1
#      c: 0.0
#      b: 6.0
#
#    min_area:
#      a: 0.05
#      b: -20.0
  local_search_depth_k: 0.0         # extra radius: r = base + k/depth_m (0 = fixed radius)
  blob_cross_mask_margin_px: 3      # extra px added to matched-blob radius when masking ctrl A from ctrl B
  cross_controller_blackout: true   # before a controller's full-image COLD detection, zero out every
                                     # other warm controller's expected LED neighborhoods (exact same
                                     # radius that controller's own hybrid-warm detection already uses,
                                     # no extra margin) — cold brute-force then never considers pixels
                                     # already accounted for by another controller's tracked LEDs

  # ── Cold path – pass 1 (full-image detection, no prior) ───────────────────
  outlier_factor: 2.5               # 1-NN distance > this * median(1-NN) → spatial outlier
  interior_edge_margin_px: 10.0    # centroid farther inside a large rejected blob than this is dropped

  # Single-frame, stateless structural filter for ceiling-lamp fixtures.
  # Rewritten 2026-09-08 -- see src/lamp_blob_filter.py's module docstring
  # for the full design and the empirical basis for every number below; this
  # is the short version. Scoped to the cold and hybrid-warm stats-based
  # paths only (same `not warm_mode` gate as interior_edge_margin_px above)
  # -- never reaches _detect_blobs_local's per-LED fit search. No cross-frame
  # tracking, no 3D mapping -- deliberately simpler than the mocap-grounded
  # 3D voxel-vote/lattice-fit approach explored earlier (dev-time/offline
  # only tool; this filter needs nothing but the current frame).
  lamp_blob_filter:
    enabled: true

    # Both added 2026-09-09 investigating a real performance blowup: lowering
    # blob_detection.min_threshold let far more faint pixels through as
    # "dim" context blobs (see src/blob_detector.py's own comment on why dim
    # blobs get combined with kept ones here at all) -- one real cam3 frame
    # had 8 kept blobs but 429 scattered dim ones, and _find_dominant_lines'
    # cost grows roughly cubically with pool size (every seed pair tested
    # against every pool point -- see that function's own docstring),
    # turning a sub-millisecond search into 0.8-3.3s PER cold-detect call.
    # dim_context_radius_px is the primary fix (a dim point with no kept
    # blob anywhere near it was never real "context" for anything -- see
    # restrict_dim_context_to_kept_neighborhood's own docstring in
    # src/lamp_blob_filter.py); max_pool_size is a defense-in-depth circuit
    # breaker independent of that (e.g. a scene with many densely-clustered
    # KEPT, not just dim, blobs, which the radius restriction alone can't
    # bound). Neither should ever fire on a normal recording -- this
    # project's own frames typically show 6-15 points in this pool.
    dim_context_radius_px: 150.0  # matches this file's own documented real-fixture-row span (100-150px,
                                   # see spacing_max_px's own comment below) -- generous enough that no
                                   # genuine same-row dim member should ever be excluded just because the
                                   # nearest kept member sits at the row's opposite end
    max_pool_size: 150            # skip lamp filtering entirely (safe failure mode -- nothing removed,
                                   # not a crash) once the kept+dim pool exceeds this; measured ~55ms at
                                   # 150 points on a real dense frame, well under a real per-frame budget

    # A real fixture row shows 14-15 points per row on this project's own
    # recordings, spanning 100-150px, with spacing dominated by 5-9px steps
    # and at most one or two larger physical gaps up to ~19-20px. A real
    # controller LED ring, at ANY pose or distance (verified by directly
    # projecting all 32 real LEDs through this project's own camera model,
    # across 100,000 random poses plus a systematic edge-on/tangential sweep
    # -- see src/lamp_blob_filter.py's docstring), never produces a run of
    # points spaced like that: it's either too few, or bunched far tighter
    # (~3px) than spacing_min_px. So min_points + the spacing bounds ARE the
    # real safety margin here -- several pixels of headroom against every
    # controller pose tested, not a fraction of a pixel like the old design.
    area_min: 0.4
    area_max: 70.0   # RAISED A THIRD TIME 2026-09-13 from 50.0 -- a real, individually-valid lamp
                     # element (cam3, right, frame_range 5350-5400 relative frame 3, region
                     # ~[500,350,635,400]) merged/widened to contourArea=52.0 at this recording's own
                     # pass-1 threshold, just 2px^2 over the previous 50.0 ceiling -- otherwise a
                     # perfectly ordinary row member (10.8px from its nearest real neighbor, well
                     # inside spacing_max_px), silently excluded from area_ok and left permanently
                     # unremovable (a KEPT, blob_detection-legitimate candidate excluded ONLY by this
                     # filter's own inner area check, not blob_detection's own much larger max_area=500
                     # -- so it never reaches the too-large-blob split-peak context path either).
                     # 70.0 gives ~35% margin over the observed 52.0, matching this fix's own established
                     # margin philosophy (~28% then ~39%, now ~35%). Confirmed via a direct A/B
                     # comparison on this recording: fixes exactly this one case (17->16 leaked
                     # candidates over the region/frame range above), no effect on any other frame.
                     # Same non-safety-relevant reasoning as both prior increases below: area was never
                     # part of the 100k-pose controller-ring simulation (only 2D projected-position
                     # spacing/count/residual were), so widening this again cannot newly let a
                     # controller-ring pose satisfy it.
                     #
                     # RAISED AGAIN 2026-09-11 from 25.0 -- 25.0 (set 2026-09-10, see the case below)
                     # turned out to be a second instance of the SAME underestimate, not a one-off:
                     # confirmed on a real 5-frame sequence (frame_range 1785-1790, cam1 right,
                     # bbox ~[510,90,635,160]) across FOUR separate frames, all the same fixture --
                     # individually-legitimate, correctly-circular, correctly-sized-by-blob_detection's-
                     # own-standards kept blobs with real areas up to 36.0px^2 (28.5, 30.0, 32.5, 33.5,
                     # 35.5, 36.0 all observed) were silently excluded from area_ok, each one sitting
                     # directly in-line (confirmed via pairwise spacing, all inside spacing_max_px)
                     # with an otherwise-correctly-recognized-and-removed run of the same real lamp
                     # row -- invisible to the line-finder regardless of min_points/spacing/residual,
                     # exactly like the 2026-09-10 case. 50.0 gives ~39% margin over the observed
                     # 36.0px^2 max (deliberately more generous than the prior fix's ~28%, given this
                     # is the second time the bound was underestimated from real data). Still does not
                     # touch the core safety argument at all -- see area_min/area_max's own original
                     # 2026-09-10 reasoning immediately below, unchanged: area was never part of the
                     # 100k-pose controller-ring simulation (only 2D projected-position
                     # spacing/count/residual were), so widening this cannot newly let a
                     # controller-ring pose satisfy it.
                     #
                     # ORIGINAL 2026-09-10 case (raised from 15.0 to 25.0), kept for history: a genuine
                     # single-column 14-point lamp fixture (cam3, right, frame_range 600-700 relative
                     # frame 1) had 8 points area 7-10px^2 (correctly caught) and 6 points area
                     # 13.5-19.5px^2 (silently excluded) -- same mechanism, smaller numbers.
    spacing_min_px: 4.0    # tighter than this = a real controller ring's tightly-bunched silhouette edge
    spacing_max_px: 32.0   # RAISED 2026-09-13 from 25.0 -- cam3's own upper lamp row (frame_range
                            # 5350-5400 relative frames 1-3) has a genuine ~30px physical gap (verified
                            # by direct pixel inspection: pure background noise in between, no hidden
                            # signal at any threshold), just past the old 25.0 ceiling, permanently
                            # leaking that row's leftmost real element. 32.0 gives ~2px margin over the
                            # observed 30.5px. Paired with min_points raised 5->6 below in the SAME
                            # change -- re-validated together via this project's own random-pose
                            # methodology (30,000 real-LED-ring trials, probe_spacing_max_px_safety.py,
                            # throwaway/not committed): min_points=6 + spacing_max_px=32 measures
                            # 2.61% false-positive rate, LOWER than the 14.86% the actually-shipped
                            # min_points=5 + spacing_max_px=25 combination measured in the same run --
                            # i.e. this change is a net safety IMPROVEMENT despite widening spacing,
                            # because min_points=6 dominates. Never raise spacing_max_px again without
                            # re-running this same real-LED-ring simulation (not just the edge-on-only
                            # ControllerRingSafetyTests sweep) at whatever min_points is shipped at the
                            # time -- the two parameters interact, isolated reasoning about either one
                            # alone is not sufficient (see min_points=5's own history below: it was
                            # NEVER re-validated against this simulation at all, only against min_points
                            # itself changing spacing_max_px=25 fixed).
    min_points: 6           # RAISED 2026-09-13 from 5 (paired with spacing_max_px above) -- see that
                            # key's own comment for the joint re-validation. The 2026-09-11 rationale for
                            # 5 below is now superseded (this project's own real random-LED-ring
                            # simulation, not just the theoretical edge-on sweep, showed 5 carried a
                            # 14.86% false-positive rate, far higher than anyone had actually measured
                            # before shipping it) -- kept for history.
                            #
                            # SUPERSEDED 2026-09-11 rationale for min_points=5 (RAISED then from 6):
                            # against RANDOM SCATTER points (500 trials of 80 random points each, zero
                            # false positives), never against the real controller-LED-ring geometry
                            # itself projected through many poses -- a materially weaker test, since a
                            # ring's own 32 LEDs are NOT randomly scattered, they're highly structured
                            # (evenly spaced around a real circle), which is exactly what can
                            # accidentally line up. Direct simulation with the real LED ring (32 real
                            # LEDs, data/controllers/*.json, projected through this project's own real
                            # camera model across 30,000 uniformly-random orientations/distances, not
                            # just the edge-on/tangential sweep in tests/test_lamp_blob_filter.py's
                            # ControllerRingSafetyTests) found min_points=6 actually false-positive
                            # removes at least one real LED in 2.17% of random poses (worst case: ALL
                            # visible LEDs removed) -- a real, non-negligible exposure the original
                            # edge-on-only + random-SCATTER validation never covered. Same simulation
                            # at min_points=7: 0.29% (13x fewer); min_points=8: 0.02%; min_points=9:
                            # 0.00% (zero in 30k trials). 7 is a middle ground, not zero-risk -- re-run
                            # the same real-LED-ring simulation (not just random scatter) before ever
                            # lowering this again. NOTE: 2.17%/0.29% are rates over UNIFORMLY RANDOM
                            # SO(3) orientations, not real hand-motion statistics -- real recordings
                            # don't sample orientation space uniformly, so the practical rate on real
                            # data is plausibly lower, but not necessarily zero.
                            #
                            # ORIGINAL 2026-09-?? reasoning for 6 (kept for history): n=6 needs
                            # residual >= 11.96px and n=7 needs >= 14.7px to be achieved by any
                            # controller pose in the EDGE-ON sweep above (vs. this file's
                            # max_line_residual_px=2.0 -- 6-7x headroom either way) -- true, but an
                            # incomplete picture per the above. Lowered from 8 after a real recording
                            # (frame_range 200-300, relative frame 32) showed a genuine 7-point lamp
                            # row go un-recognized and leak through un-filtered.
    max_lines: 20           # a frame can hold several separate lamp elements at once (this project's own
                            # recordings show up to 6 distinct real lines in a single cam3 frame) -- each
                            # candidate line is independently gated by min_points/spacing/residual/brightness
                            # regardless of how many are found, so a generous cap here costs CPU, not safety

    # Guards against removing a real controller LED -- both conjunctive per
    # candidate (either failing spares the WHOLE candidate, not just the one
    # offending blob).
    max_brightness: 210         # RAISED AGAIN 2026-09-11 from 80 -- 0-255 (blob's single
                                 # brightest pixel); every member blob of a candidate must be <=
                                 # this or the whole candidate is spared. 80 (set earlier the same
                                 # day for a 61-brightness split-peak case, see history below) was
                                 # found to be the SAME underestimate pattern a second, much larger
                                 # time: confirmed on a real frame (cam3, left, frame_range
                                 # 1700-1735 relative frame 24) -- TWO clean, genuinely real lamp
                                 # rows (14 and 13 points, residuals 1.20px/1.22px, exactly this
                                 # project's own documented real-fixture-row signature) were BOTH
                                 # entirely spared, because each row had one member reading 84 and
                                 # 130 respectively -- comfortably real fixture brightness, not a
                                 # fluke, confirmed visually against the raw frame (a clean bright-
                                 # to-dim diagonal gradient along the whole row, not an isolated
                                 # spike).
                                 #
                                 # This is a structural conflict, not a threshold that was merely
                                 # set a bit too low: this project's own real bright-LED range on
                                 # this recording (measured brightnesses of genuinely tracked/
                                 # accepted LEDs: median 40, up to 203) OVERLAPS the real lamp-row
                                 # brightness range (now confirmed up to at least 130) over most of
                                 # its span. No single max_brightness value can both (a) spare every
                                 # real accepted-LED brightness up to 203 AND (b) reject a lamp row
                                 # reaching 130 -- there is no gap between the two populations to
                                 # place a threshold in. 210 leaves the guard covering only the
                                 # narrow band between the real lamp max seen so far (130) and the
                                 # real LED max seen so far (203) rather than trying to draw a line
                                 # through territory both populations actually occupy; this is
                                 # consistent with the guard's own designed role -- it is
                                 # explicitly defense-in-depth, not the real safety margin (that's
                                 # min_points+spacing+residual below, never brightness-dependent,
                                 # and validated directly against the real controller-LED-ring
                                 # geometry via 100k-pose simulation) -- so widening it further does
                                 # not touch the core safety argument, only how much this
                                 # SECONDARY guard still does on top of it. If a future real case
                                 # again needs this raised past 203 (the current documented real-LED
                                 # ceiling), that's a sign this guard has stopped being able to
                                 # discriminate anything at all on this recording and should be
                                 # dropped rather than raised again.
                                 #
                                 # ORIGINAL 2026-09-11 case (60->80), kept for history: a genuine
                                 # 23-point lamp row (residual 1.08px, spacing 5-9px) was entirely
                                 # spared because ONE of its real peaks -- a split-peak point from a
                                 # big pass-2 merged blob (see blob_detector.py's too-large-blob
                                 # context injection) -- measured brightness=61, just 1 unit over
                                 # the old 60 bound. Production's real floor is required_threshold =
                                 # min_threshold*required_threshold_factor (7*2.0=14 by this file's
                                 # own values above, cold path; the hybrid warm path can relax this
                                 # down to min_threshold=7 at speed, see velocity_threshold_k above)
                                 # -- every blob reaching this filter already clears that; real LEDs
                                 # typically saturate far brighter.
    max_line_residual_px: 2.0   # every line in a candidate must have max perpendicular PCA-fit
                                 # residual <= this or the whole candidate is spared. Generous by
                                 # design: min_points+spacing above is the real guard (no
                                 # controller pose in the simulation ever achieved lamp-like
                                 # spacing below a 6.6px residual, and never at all for >=7
                                 # points), so this mainly protects against a coincidental,
                                 # unrelated set of points that happens to satisfy count+spacing.
                                 # Real confirmed lamp rows measure ~0.10-0.41px noise on real
                                 # hardware -- 2.0px leaves ~5x headroom above that.

    pass2_exclusion_pad_px: 22.0  # radius (px) of the exclusion footprint drawn around every point
                                 # of a REMOVED lamp candidate (full kept+dim/context set, not just
                                 # the removed kept blobs), fed into pass 2 the same way an oversized
                                 # pass-1 blob's H1 interior-exclusion zone is. Pass 2 re-thresholds
                                 # lower and never sees this pass's lamp-filter decision, so without
                                 # this it independently re-discovers the same physical lamp elements
                                 # -- now at a threshold permissive enough to pull in even MORE of the
                                 # fixture's dim elements, un-filtered (this filter never re-runs on
                                 # pass 2's own blob set).
                                 #
                                 # MUST stay comfortably above interior_edge_margin_px above (default
                                 # 10.0) -- the H1 exclusion check only rejects a point MORE than
                                 # interior_edge_margin_px deep inside the contour, not merely inside
                                 # it. Confirmed on real data (cam3 frame 36): an earlier 8.0px pad
                                 # left a real lamp point at pointPolygonTest distance 7.0 (inside,
                                 # but not deep enough) -- pass 2 then re-discovered it, un-filtered.
                                 # 22.0 = interior_edge_margin_px(10) + 12px margin.

    static_lamp_mask:              # src/lamp_region_memory.py -- once a lamp fixture is recognized
                                    # (still via detect_lamp_blobs above, unchanged), remembers its 2D
                                    # bounding box as a 3D RECTANGLE at ceiling_height_m and hard-masks
                                    # it out of every future frame via mocap reprojection. Deliberately
                                    # rough/coarse on purpose -- REPLACES an earlier point-level anchor
                                    # system (src/lamp_anchor_memory.py, removed 2026-09-13) that
                                    # reprojected individual points into this SAME dim-context pool,
                                    # hoping detect_lamp_blobs' own line-finder (spacing/residual/
                                    # min_points) re-recognized the row every frame -- that required a
                                    # long chain of fragile point-level fixes (merge-radius blur,
                                    # anchor/real-point spacing collisions) and still wasn't fully
                                    # reliable. This hard mask bypasses the line-finder entirely for
                                    # persistence, at the cost of precision the user explicitly said is
                                    # fine to give up ("rough estimate... I trust it"). No-op unless
                                    # main.py's caller also supplies a camera/pose_source/frame_ts_ns
                                    # (requires mocap.enabled). EXCLUSION (region_exclude_blobs, actually
                                    # rejecting a candidate) is still cold-path-only, by design, and
                                    # always will be -- see warm_lamp_refresh_interval_s below for why.
                                    # TRACKING (update()/sustain_and_expire(), keeping a region's own
                                    # hits/bounds fresh) used to ALSO be cold-only, purely for cost
                                    # reasons -- CHANGED 2026-09-14 (user-proposed design): a region's
                                    # lifecycle could freeze mid-stream for an arbitrarily long
                                    # warm-tracked stretch, so whenever a controller eventually DID lose
                                    # track and fall back to cold re-detection, whatever region state
                                    # existed however long ago the last cold frame happened is what got
                                    # used -- confirmed as a real contributing cause of a reported bug (a
                                    # region sitting at hits=2, below min_hits_to_exclude, at exactly the
                                    # moment a lost-track cold re-detection needed it most). See
                                    # BlobDetector._run_warm_lamp_shadow_pass's own docstring in
                                    # src/blob_detector.py for the full design and its accepted tradeoffs.
                                    # Properly supported under matching.parallel_blob_detection_enabled:
                                    # true as of 2026-09-13 (camera/pose_source registered with the worker
                                    # pool, LampRegionMemory round-tripped like _memory).
                                    #
                                    # LIFECYCLE REWRITTEN 2026-09-13: a region is now a LIVE,
                                    # continuously re-measured thing, not a permanent memory. Once
                                    # created (detect_lamp_blobs' own strict recognition, unchanged),
                                    # every lamp-region-active frame checks each held region against
                                    # THAT frame's own raw candidate pool (see sustain_min_points) and
                                    # either refits it tightly to just the currently-supporting points,
                                    # or counts one frame of "no support" toward
                                    # expire_after_no_support_frames, after which it is deleted outright
                                    # -- see src/lamp_region_memory.py's own module docstring for the
                                    # full reasoning (an earlier freeze_after_hits/regrowth_confirmations
                                    # design, both now REMOVED, tried to manage a permanent accumulated
                                    # union instead; a real bad-freeze case, cam2 right [0,330,230,360],
                                    # showed that a box established from a near-static/low-parallax
                                    # initial view could just be wrong and never self-correct).
      enabled: true                # opt-in, matches this project's convention for new features
      warm_lamp_refresh_interval_s: 0.15   # NEW 2026-09-14: minimum spacing, in the RECORDING's own
                                     # clock (frame_ts_ns, not wall-clock -- this pipeline processes
                                     # prerecorded sequences offline, often far from real-time), between
                                     # BlobDetector._run_warm_lamp_shadow_pass's full-frame pass1-only
                                     # "shadow" detections during a warm-tracked stretch. Lamps are
                                     # static -- they don't need per-frame freshness, only "not too stale
                                     # by the time a cold fallback needs them" -- so a modest real-time
                                     # cadence gets most of the benefit of always-on tracking at a
                                     # fraction of its cost. Deliberately NOT per-frame: a real full
                                     # detection pass (threshold + connected components + circularity)
                                     # every single frame, on top of the already-cheap warm/local per-LED
                                     # search, is a real, measurable CPU cost on the most common
                                     # (warm-tracked) frame this whole mechanism was originally exempted
                                     # from for exactly that reason -- benchmark before lowering this much
                                     # further. This ONLY feeds region tracking (update()/
                                     # sustain_and_expire()) -- it never gates the warm/local path's own
                                     # LED matching, which stays completely lamp-unaware by design: LEDs
                                     # sit in a ring around the controller body, so a lamp visible behind
                                     # the controller is the common case the controller's own body
                                     # already occludes; a real LED and a real lamp element being
                                     # simultaneously visible AND close enough to be confused is rare
                                     # enough that gating the hot per-LED search on an (imperfectly-tight)
                                     # mask would trade a rare true positive for a routine false negative.
      recent_memory_max_s: 0.05     # NEW 2026-09-15 (user-proposed design: skip lamp EXCLUSION -- never
                                     # tracking -- on a cold re-detect if the controller has a recent,
                                     # strong last_good_pose, since ControllerTracker's own
                                     # vs-last_good_pose jump-gate already independently corroborates that
                                     # kind of candidate). Read by main.py's own _has_recent_memory
                                     # helper, NOT by anything in this file's own blob-detection code.
                                     # Deliberately tight, fixed after a 3-agent critique found the first
                                     # version (checked ONLY "is last_good_pose set at all," no recency
                                     # requirement) unsafe: last_good_pose is retained indefinitely across
                                     # loss events by design, while the jump-gate it leans on
                                     # (matching.max_plausible_hand_speed_m_s/_ang_speed_deg_s-based
                                     # widening, src/controller.py) has NO cap and, at this project's own
                                     # REAL shipped matching.* values, reaches its rotation ceiling (180
                                     # degrees -- a total no-op) after roughly 70ms of staleness. 0.05s
                                     # sits comfortably under that so the corroborating check still has
                                     # real discriminative power whenever this returns true. See
                                     # _has_recent_memory's own (long) docstring in main.py for the full
                                     # story, including a second, independent fix (also requiring
                                     # last_good_pose_quality to already be strong, closing a separate
                                     # _quality_rescue outright-bypass gap) and a known, deliberately
                                     # accepted residual risk this does NOT fully close.
      ceiling_height_m: 3.15        # unchanged from the removed point-anchor system's own calibration
                                     # (probe_lamp_anchor_height.py, cam3 frames 0-13 of this recording)
                                     # -- room frame is Y-up (MOCAP_ROOM_G_WORLD, src/imu_data.py), NOT
                                     # Z; a region's 4 corners sit on the plane Y=ceiling_height_m.
      bbox_pad_m: 0.2                # REPLACED 2026-09-13 (was bbox_pad_px, a PIXEL padding applied
                                     # before ray-casting) -- padding is now applied AFTER ray-casting,
                                     # directly in room-frame meters. Real bug found on live usage
                                     # (cam2, right): the same fixed pixel padding translated to wildly
                                     # different REAL margins ("some lamps get ok offsets, some get very
                                     # wide ones") because this camera's pixel-to-ceiling-plane
                                     # projection is highly anisotropic -- a near-grazing ray amplifies a
                                     # few pixels into a huge real distance, a near-vertical ray barely
                                     # amplifies it at all. A fixed metric padding guarantees every lamp
                                     # gets the same real-world margin regardless of viewing angle.
      max_region_size_m: 3.0        # NEW 2026-09-13, RAISED from 1.5 same day -- a single region's own
                                     # XZ extent may never exceed this: used both at CREATION (update()
                                     # rejects a large/noisy structure -- a wall reflection or other
                                     # big-area spurious blob that happened to satisfy detect_lamp_blobs'
                                     # own spacing/residual checks -- outright) and at every per-frame
                                     # REFIT (sustain_and_expire() distrusts an implausibly-large fresh
                                     # measurement rather than applying it -- see that method's own
                                     # comment). 1.5 (derived from a single ~0.8m row on cam3, see
                                     # project_lamp_row_leak_frames1_13 memory) turned out FAR too tight
                                     # once tested on a different camera/fixture: real single-recognition
                                     # footprints on cam2 (right) routinely reached ~1.4m on their own,
                                     # meaning almost every merge attempt between clearly-the-same-fixture
                                     # regions got rejected by this cap, permanently fragmenting one real
                                     # fixture into several near-duplicate, never-consolidating boxes
                                     # (the ~0.9 IoU duplicates the user kept seeing). 3.0 gives real
                                     # headroom while size_cap_bypass_iou below is the actual fix for
                                     # that fragmentation (this cap now only matters for LOW-confidence,
                                     # center-distance-only merges). No separate "absolute, never-
                                     # bypassed" ceiling anymore (an earlier `absolute_max_region_size_m`
                                     # existed only to bound a CHAIN of ever-growing merges under a
                                     # permanent-union/freeze model that no longer exists -- see
                                     # src/lamp_region_memory.py's own module docstring).
      size_cap_bypass_iou: 0.5      # NEW 2026-09-13: a merge triggered by IoU at or above this value is
                                     # exempt from max_region_size_m -- two regions overlapping this much
                                     # are unambiguously the same physical object no matter how "big" it
                                     # is. This is the actual fix for the "0.9 IoU duplicates never merge"
                                     # bug found on live usage (cam2, right) -- lower-confidence merges
                                     # (below this IoU, or triggered only by merge_center_distance_m)
                                     # still respect max_region_size_m as a sanity check.
                                     # Safe again as of recent_quad_window below (2026-09-14): this bypass
                                     # used to be able to push a region PERMANENTLY past max_region_size_m
                                     # (confirmed on real data: a 4.97m x 4.63m runaway) since nothing
                                     # ever shrank it back. Now bounded by the same trailing window every
                                     # other growth path is, so a bypassed merge can only inflate a region
                                     # temporarily -- it self-corrects over the next recent_quad_window
                                     # sustained frames as older quads age out.
      recent_quad_window: 20        # NEW 2026-09-14 (independent code review + real ground-truth
                                     # evaluation, seq1/walk_hard): quad_room is now recomputed from only
                                     # the last N per-observation quads (creation's own quad, or each
                                     # sustained frame's own fresh_quad -- see LampRegion.recent_quads),
                                     # not an ever-growing all-time union. Root problem this fixes: the
                                     # old all-time union had NO way back down -- sustain_and_expire's own
                                     # size check only ever blocked FURTHER growth once a region got too
                                     # big, it never shrank anything, so a single bypassed merge (see
                                     # size_cap_bypass_iou above) could inflate a region permanently.
                                     # Confirmed on real data: a region with hits=80 had grown to 4.97m x
                                     # 4.63m (~23 square meters) -- physically absurd, and the direct
                                     # cause of two real complaints: (1) a room-space box that size
                                     # reprojects through this camera's wide-FOV fisheye lens with its 4
                                     # corners at wildly different viewing angles, which straight
                                     # pixel-space edges render as a grotesquely skewed/twisted shape (NOT
                                     # a kb4 math bug -- a symptom of the box itself being absurd), and (2)
                                     # the extra area masked far more background/noise as "lamp" than the
                                     # real fixture ever covered. 20 is a middle ground: small enough that
                                     # a stale oversized quad actually ages out within a real recording's
                                     # own timescale (re-validated against ground truth after this
                                     # change), large enough to still tolerate several consecutive
                                     # partial-visibility frames without prematurely shrinking a
                                     # still-real fixture (the exact regression "union, not replace" was
                                     # originally fixed for -- see sustain_and_expire's own docstring).
      min_hits_to_exclude: 3         # NEW 2026-09-13: a region only actually excludes anything (see
                                     # reprojected_contours()) once recognized/sustained this many times
                                     # -- update()/sustaining still happens from hits=1, but a region
                                     # doesn't get to mask anything out until reinforced. Found on live
                                     # usage: a one-off line-finder false positive (e.g. off a wall
                                     # reflection) would otherwise immediately become a permanent hard
                                     # mask; a real static lamp gets re-recognized/sustained across many
                                     # consecutive frames essentially for free, so this costs it nothing.
                                     # FIXED 2026-09-14 (independent code review, 3-agent critique):
                                     # this shipped as 1 -- and LampRegion.hits starts at 1 -- so the
                                     # documented protection above was a complete no-op in production
                                     # (every region excluded on its own first frame, with ZERO
                                     # reinforcement). tests/test_lamp_region_memory.py already asserted
                                     # 3 is required to block exclusion at hits=1, and
                                     # LampRegionMemory.__init__'s own code default was already 3 --
                                     # only this config value had silently drifted. Now guarded by
                                     # tests/test_lamp_mask_config_sanity.py, which reads THIS file
                                     # directly (a constructor-level assertion was tried first but
                                     # reverted -- it also blocked 27 unrelated unit tests that
                                     # deliberately construct LampRegionMemory with min_hits_to_exclude=1
                                     # as a documented convenience).
      sustain_min_points: 3           # NEW 2026-09-13 (lifecycle rewrite), RENAMED from sustain_min_kept
                                     # same day after a real bug: per-frame liveness bar for an
                                     # ALREADY-HELD region -- deliberately much lower than
                                     # detect_lamp_blobs' own from-scratch min_points (e.g. 6). Once a
                                     # fixture is already known, seeing this many of its own elements
                                     # again each frame is enough proof it's still there; the strict
                                     # spacing/residual line-fit only has to pass once, at creation, not
                                     # every single frame after. Counts KEPT (bright) and DIM points
                                     # TOGETHER -- the original version counted only kept ones (mirroring
                                     # detect_lamp_blobs' own "dim points are context, never
                                     # independently sufficient" philosophy for FRESH recognition), but
                                     # that turned out to be a real bug, not a safety feature: confirmed
                                     # via e2e tracing (cam0, left lamp) that a frame with 20 real dim
                                     # points and only 2 kept ones was counted as "no support" under the
                                     # kept-only rule, expiring a region with overwhelming real evidence
                                     # and forcing it to be re-created from scratch repeatedly. Dim points
                                     # landing inside an ALREADY-established region's own tight footprint
                                     # aren't the same false-positive risk as dim noise trying to seed a
                                     # brand-new recognition from nothing, so they're trusted here.
      expire_after_no_support_frames: 30   # NEW 2026-09-13 (lifecycle rewrite): a region that fails
                                     # sustain_min_points this many CONSECUTIVE frames (out of view
                                     # counts as zero support too; resets to 0 on any single sustained
                                     # frame in between -- an earlier version of this comment said "not
                                     # necessarily consecutive", which did not match the code and was
                                     # fixed 2026-09-14, see LampRegion.no_support_streak's own comment)
                                     # is DELETED outright. User's own framing: "if there are not enough
                                     # blobs anymore, this bbox must be gone" / "if it goes out of view,
                                     # you can also let it go" -- no more permanent mocap-only memory
                                     # once real evidence stops backing a region up.
                                     # RAISED 2026-09-14 from 10 (independent code review + ground-truth
                                     # evaluation against 350 hand-labeled real frames, seq1/walk_hard):
                                     # a region's quad_room bounds NEVER change while unsustained (only
                                     # no_support_streak increments) -- so a longer grace period carries
                                     # no drift risk, only a longer wait before deleting a truly-gone
                                     # fixture. The measured cost of the OLD value of 10 was severe: a
                                     # region with hits in the dozens expired mid-pan (real elements
                                     # briefly falling below sustain_min_points as the row approached the
                                     # image edge -- KB4 fisheye compression/vignetting), and
                                     # RE-CREATION requires clearing detect_lamp_blobs' full from-scratch
                                     # bar (min_points=6 + spacing/residual) in a single cold frame --
                                     # much harder than the sustain bar that was just failing -- so the
                                     # region didn't reform until the pan finished, ~50 frames later. Over
                                     # that whole gap, the real lamp's own bright pixels were fully
                                     # unmasked (measured: 24% of a real 350-frame walk-hard sequence had
                                     # ZERO mask coverage of a real, GT-labeled, visible lamp). The
                                     # region-level safety nets that should bound the cost of a long-lived
                                     # STALE region (min_hits_to_exclude, max_brightness below) were
                                     # ALSO found broken as shipped in this same review and have been
                                     # fixed alongside this change -- see their own comments.
      interior_margin_px: -6.0       # H1-style margin (mirrors blob_detection.interior_edge_margin_px):
                                     # a candidate is only excluded once MORE than this deep inside the
                                     # reprojected mask, protecting a real LED grazing its edge. NEGATIVE
                                     # since 2026-09-13's rotated-rect-to-real-points revert (see
                                     # lamp_region_memory's own module docstring): update() now ray-casts
                                     # a candidate's own real recognized points instead of a bounding
                                     # rectangle's 4 corners, which produces a region so tight (no leftover
                                     # rectangle-corner slack at all) that a genuinely-the-same lamp row
                                     # re-recognized a few frames later, with a few px of mocap/reprojection
                                     # jitter, can land measurably OUTSIDE the stored box rather than just
                                     # near its inside edge. Confirmed on the real recording (cam3,
                                     # frame_range 5350-5400, bbox [575,330,635,370]) by sweeping this value:
                                     # 0 -> 72 leaked, -1 -> 42, -2 -> 19, -3 -> 4, -4 -> 1, -5 -> 0 (first
                                     # value to fully close the leak over 51 frames); -6.0 keeps one extra
                                     # pixel of headroom beyond that minimum. bbox_pad_m was tried first
                                     # (the room-space-metric fix that worked for other issues on this
                                     # camera) but is NON-monotonic here for the same reason it was
                                     # rejected during the rotated-rect episode -- this camera's fisheye
                                     # projection is highly anisotropic, so a uniform metric pad distorts
                                     # unpredictably across viewing angles; this per-frame PIXEL-space
                                     # margin sidesteps that entirely. The real safety net against clipping
                                     # a genuine controller LED is max_brightness below, not this margin --
                                     # a real LED is expected to be much brighter than a lamp element
                                     # regardless of how deep inside (or, now, how far outside) the mask it
                                     # might sit.
      sustain_cluster_max_m: 0.3     # NEW 2026-09-14, prompted by a classical-ML feature analysis
                                     # (analyze_lamp_features.py / fit_lamp_classifier.py, not committed)
                                     # run against real hand-labeled ground truth (seq1/walk_hard, a dark
                                     # real recording): during sustain_and_expire()'s per-frame refit, the
                                     # ray-cast room-space points are reduced to only their SINGLE LARGEST
                                     # connected cluster (any two points within this many meters of each
                                     # other are linked, transitively -- see
                                     # src/lamp_region_memory.py's _largest_cluster_xz) before taking
                                     # bounds -- a spatially-separate group of points (a second real
                                     # structure, or a spatially-distinct patch of correlated noise) that
                                     # also falls inside an already-big region's contour is dropped
                                     # wholesale, however internally dense it is on its own.
                                     #
                                     # Two things had to be discovered to land on this design. First:
                                     # brightness turned out to be nearly USELESS for telling a real lamp
                                     # element apart from noise on this recording (every single raw
                                     # candidate blob measured <= 210, this project's own max_brightness
                                     # gate -- lamp mean max_pix=14, everything-else mean=50, so that gate
                                     # accepted 100% of candidates here). What actually separated the two
                                     # classes was nearest-neighbor distance (lamp median 7.6px vs 13.8px)
                                     # and local row-collinearity (lamp median residual 2.7px vs 5.9px) --
                                     # "close to other points, in a line" is what characterizes a real lamp
                                     # element here, not brightness. Second: a first implementation applied
                                     # this filter in PIXEL space, directly on the points gathered inside
                                     # src/blob_detector.py -- confirmed INEFFECTIVE on real data, because
                                     # this camera's fisheye projection is highly anisotropic at oblique
                                     # viewing angles (the very same effect bbox_pad_m's own comment already
                                     # documents for a different reason): the same real-world gap can span
                                     # far more pixels near the image edge than near center, so a fixed
                                     # pixel-space threshold failed to separate two genuinely distinct
                                     # clusters exactly where it mattered (a region sitting at 24-58 degree
                                     # viewing angles). Moved to room-space METERS, applied after
                                     # ray-casting inside _ray_cast_points_to_quad, which is immune to that
                                     # anisotropy by construction. Confirmed on real data: without this
                                     # (in either form), a region with hits=80 had grown to a physically-
                                     # absurd 4.97m x 4.63m (~23 square meter) footprint -- a
                                     # self-reinforcing feedback loop (a bigger region catches more of
                                     # whatever else is nearby, which then keeps it big). 0.3m is generous
                                     # enough that single-linkage clustering still keeps one genuinely long,
                                     # continuous fixture together (chained via its own adjacent-element
                                     # gaps -- this project's own real recordings show roughly 0.1-0.3m bead
                                     # spacing at typical viewing distance -- not the row's total span),
                                     # while rejecting a truly separate structure or noise patch.
                                     #
                                     # NOTE (separate, NOT acted on here): this same analysis also shows
                                     # lamp_blob_filter.max_brightness's own 210 is a near-total no-op on
                                     # THIS recording's actual brightness scale -- deliberately NOT retuned
                                     # as part of this change, since that constant is shared with
                                     # detect_lamp_blobs' own creation-time recognition and is validated
                                     # against a separate, extensive controller-LED-ring safety simulation
                                     # (probe_spacing_max_px_safety.py) that would need re-running against
                                     # this recording's own real brightness range before touching it --
                                     # flagged for a future, deliberate pass, not bundled in.
      # max_brightness: intentionally NOT set here (was 255 -- REMOVED
      # 2026-09-14, independent code review). This is the safety guard: a
      # real, bright controller LED that later wanders through a remembered
      # lamp region must still survive (src/blob_detector.py's region-
      # exclusion check only excludes when max_pix <= this value). Blob
      # brightness is an 8-bit pixel value (0-255), so the old 255 made
      # `max_pix <= 255` unconditionally true -- the guard could NEVER fire,
      # for any blob including a fully-saturated real LED. The comment above
      # even said this was meant to "mirror lamp_blob_filter.max_brightness's
      # own intent" (210) while shipping a value that did the opposite of
      # that intent. Rather than keep two independently-settable numbers for
      # the same purpose (the exact drift that caused this bug), this key is
      # now simply absent: src/blob_detector.py's own fallback
      # (`region_cfg.get("max_brightness", lamp_cfg.get("max_brightness",
      # 210.0))`) already inherits lamp_blob_filter.max_brightness directly
      # above. Re-add this key only with a real, deliberately-chosen value
      # below 255, never to "match" a value that is already inherited.
      merge_iou_threshold: 0.2       # NEW 2026-09-13: two regions merge (union, hits summed) once their
                                     # XZ bounding-box IoU reaches this -- deliberately fairly low so a
                                     # genuinely partial overlap (not just near-total duplicates) still
                                     # merges. Regression fix: near-duplicate regions at ~0.9 IoU were
                                     # persisting indefinitely under the earlier design, which only ever
                                     # compared a brand-new incoming box against its single nearest
                                     # existing region -- two regions that ended up overlapping EACH
                                     # OTHER (independently created, or a merge once skipped for size)
                                     # were never reconciled. Now every update() runs a full NMS-like
                                     # dedup pass over ALL current regions (see
                                     # LampRegionMemory._dedupe_and_cap), not just the new arrival.
      merge_center_distance_m: 0.5  # XZ room-frame distance under which two regions merge even with LOW
                                     # or zero IoU -- the "real fixture recognized as two disconnected
                                     # pieces" case (e.g. split by a physical gap the line-finder
                                     # couldn't bridge in one frame; see project_lamp_row_leak_frames1_13
                                     # memory). Either this, merge_iou_threshold, or
                                     # merge_containment_threshold below is sufficient to trigger a merge
                                     # -- merge always takes the UNION of the two rectangles' extents
                                     # (never an average), since a hard mask must stay a safe superset of
                                     # everything ever recognized there.
      merge_containment_threshold: 0.8   # NEW 2026-09-13: a THIRD merge trigger -- fraction of the
                                          # SMALLER region's own area that must overlap the larger one.
                                          # IoU and center-distance both miss the case of a small region
                                          # sitting almost entirely inside a much larger one: found on live
                                          # usage (cam2, right) -- a small region's box was 100% inside a
                                          # much larger region's box, yet IoU was only ~0.19 (the union is
                                          # dominated by the big box's own area, even at full containment)
                                          # and their centers were 1.2m apart (the small box sat in a
                                          # corner of the big one, not near its center) -- past
                                          # merge_center_distance_m too. Two regions clearly covering the
                                          # same area never merged. A containment-triggered merge also
                                          # bypasses max_region_size_m (like size_cap_bypass_iou) -- it
                                          # can't meaningfully grow the union past the larger region's own
                                          # size anyway.
      max_regions_per_camera: 5    # circuit breaker: a real room has a handful of fixtures, not
                                     # dozens -- guards against a systematically-wrong ceiling_height_m
                                     # spawning a new never-merging region every frame.

  # ── Cold path – pass 2 (adaptive re-threshold, optional) ──────────────────
  pass2_threshold_factor: 0.7       # 0 = disabled; pixel_threshold_2 = percentile(mean_per_blob) * factor
  pass2_required_factor: 1.2        # required_threshold_2 = percentile(mean_per_blob) * factor; must be > pass2_threshold_factor
  pass2_brightness_percentile: 25   # percentile of per-blob mean intensities used as brightness reference
  pass2_min_area: 2                 # null = use min_area; blobs shrink under higher threshold so can be smaller
  pass2_threshold_ema_alpha: 0.25   # EMA weight on the new threshold (0=frozen, 1=no smoothing)
  pass2_count_gate_max_factor: 1.7  # skip EMA update if blob count changes by more than this factor
                                    # max_area_pass2 = the biggest blob pass 1 actually found this frame
                                    # (already bounded by pass 1's own physics-based ceiling below) —
                                    # no separate config needed; see BlobDetector.detect for details

matching:

  # --------------------------------------------------------------------------
  # Parallel search
  # --------------------------------------------------------------------------
  parallel_search_enabled: true    # dispatch per-camera cheap search and brute-force
                                    # tier rounds to a persistent process pool; false
                                    # falls back to the equivalent sequential loop
  parallel_search_workers: 6       # pool size; null = number of cameras (4). Bumped
                                    # to nproc for warm-warm two-controller batching
                                    # (up to 2 ctrl x 4 cams concurrent tasks); realistic
                                    # load is usually <= this thanks to per-camera
                                    # visibility pruning (out-of-scope cameras are
                                    # skipped before dispatch, see main.py Phase 1).

  # --------------------------------------------------------------------------
  # LED physical model
  # --------------------------------------------------------------------------
  # TIGHTENED 2026-09-06 from 90.0 -- with the scoring formula in
  # _visibility.py (score = clip(led_facing_angle_deg / angle_deg, 0, 1) for
  # angle_deg < 90), a value of EXACTLY 90 makes 90/angle_deg >= 1.0 (clipped
  # to 1.0) for every angle from 0-90 deg -- the "soft emission-cone" scoring
  # was fully degenerate, giving every front-hemisphere LED a perfect 1.0
  # score with zero graduated falloff, right up to a hard cliff exactly at
  # 90deg. Combined with proximity_vis_score_threshold=0.95, that meant the
  # facing-angle check excluded NOTHING -- found investigating a real report
  # of proximity search bailing out to expensive brute-force on "too
  # ambiguous" scenes (est_combos in the tens of millions) at oblique camera
  # angles, where many genuinely marginal/grazing LEDs were still being
  # counted as fully visible and feeding the combinatorial explosion. 75.0
  # gives real discrimination in the 75-90deg band (effective proximity
  # cutoff ~75/0.95=79deg given the 0.95 threshold above) -- a first-cut,
  # physically-motivated value (typical IR LED emission half-angles for this
  # class of hardware), not yet empirically swept against real detectability
  # data; retune if inlier counts drop or "too ambiguous" doesn't improve
  # enough.
  led_facing_angle_deg: 75.0      # emission half-angle used to build EXPECTED-visible LED sets against a
                                   # not-yet-final pose (proximity's predicted-pose gate, brute-force
                                   # hypothesis scoring, cross-cam bonus-correspondence lookup) -- this one
                                   # is a matching-tolerance knob, safe to retune: too loose lets ambiguous
                                   # grazing LEDs flood the candidate set, too tight risks omitting a LED
                                   # that's genuinely about to be seen once the pose is refined.
  led_facing_angle_strict_deg: 90.0 # emission half-angle used for the POST-REFINEMENT truth recheck once
                                   # RANSAC has already produced an accurate pose (proximity's post-RANSAC
                                   # vis-drop, brute-force's step-6 recheck) -- this decides whether an
                                   # already-matched inlier is real or a phantom, so it should reflect the
                                   # true physical self-occlusion horizon (~90deg), not the looser matching
                                   # tolerance above. Loosening led_facing_angle_deg must NOT also tighten
                                   # this check, or genuinely-visible grazing-angle inliers with good RANSAC
                                   # agreement get spuriously dropped -> "post-vis-drop too few pairs" -> None.
  max_warm_search_cameras: 2      # cap on how many cameras a warm controller searches per frame —
                                   # candidates with mean facing_cos below warm_cam_cap_min_facing_deg's
                                   # cosine are excluded outright, survivors ranked by mean LED distance
                                   # to camera (closer wins); bounds both blob-detection and pose-search
                                   # task count per controller
  warm_cam_cap_min_facing_deg: 80.0 # cameras whose mean LED-facing angle exceeds this are excluded from
                                     # the warm-search cap ranking regardless of distance (a close but
                                     # near-edge-on camera gives worse blobs than a farther square-on one)

  # --------------------------------------------------------------------------
  # Brute match
  # --------------------------------------------------------------------------
  depth_tiers:                    # (anchor_leds, total_leds [, "edge"]) hypotheses to enumerate
                                   # RE-ENABLED 2026-09-10 -- tiers 1-5 were commented out (leftover
                                   # dev/debug state, no comment ever justified it), silently capping
                                   # every brute-force search to tier_0 only (led<=2, blob<=3) across
                                   # the whole project. Confirmed on a real case (frame 71,
                                   # right|cam1): a genuinely good 7/8-LED match existed but the
                                   # search never even got the chance to look further once tier_0
                                   # came up empty. Note: even with all 6 tiers, that SPECIFIC case
                                   # still didn't clear balanced_coverage (see the coverage-fallback
                                   # mechanism added the same day in pose_search.py for why it's no
                                   # longer silently dropped either way) -- this fix is about search
                                   # completeness/robustness in general, not that one case specifically.
    - [2, 3]
    - [2, 3, "edge"]
    - [3, 3, "edge"]

  p4_threshold_px: 2.5
  hungarian_threshold_px: 5.0    # loose pre-filter on raw P3P pose; RANSAC does the real filtering
  reprojection_threshold: 2.5    # RANSAC inlier threshold
  min_inliers: 5
  cold_brute_force_confirm_frames: 1   # a cold controller's camera must show >= min_inliers
                                        # blobs for this many CONSECUTIVE frames before brute-force
                                        # is even attempted there — filters out transient noise
                                        # blobs (e.g. 4,5,1 across 3 frames never triggers; 4,5,6
                                        # triggers on frame 3) without wasting a full P3P/gate pass
                                        # on a doomed attempt. Only applies to true cold-start
                                        # (force_brute) reacquisition, not a warm controller's
                                        # same-frame cheap-search-failure brute-force fallback.
  strong_match_error_px: 0.5
  strong_match_inliers: 6   # ADDED 2026-09-10 to the actual strong_found decision (brute_search_tier,
                             # src/pose_search.py) -- this key already existed and was loaded into
                             # BruteSearchState.strong_inliers_eff, but was dead: never read anywhere,
                             # a leftover from the tier-based rewrite. Without it, a candidate right at
                             # min_inliers (the bare floor to accept ANYTHING) could trip strong_found
                             # and stop the anchor-LED search early purely because balanced_coverage's
                             # RATIO looked favorable over a small visible-LED denominator -- confirmed
                             # on a real case: primary camera 4 inliers (exactly min_inliers) of only 8
                             # visible LEDs, pooled with 2 aux-camera inliers to n_inlier_total=6,
                             # err=0.107px, coverage=0.688 (>= min_vis_coverage) -- stopped after only
                             # 3 of 32 possible anchors. Checked against THIS camera's OWN inlier count
                             # (n_inlier_blobs) only, NOT pooled with aux cameras: "is this camera's
                             # own fit well-constrained enough to stop searching" shouldn't be
                             # satisfiable by borrowing strength from another camera's corroboration --
                             # aux evidence already has its own role, feeding balanced_coverage (both
                             # led_cov and blob_cov pool it in), separate from this floor. A handful of
                             # correspondences has little power to rule out an alternative anchor
                             # assignment producing an equally clean fit. Only gates EARLY TERMINATION
                             # of the anchor search, not acceptance -- finalize_brute_state returns
                             # state.best_solution unconditionally, so a thin candidate that never
                             # reaches "strong" is still returned/accepted if the full search completes
                             # without finding anything better (no alternative beats no solution).
  weak_solo_blob_utilization_floor: 0.7   # ADDED 2026-09-11: ControllerTracker.update's cheap-search
                             # dispatch normally skips brute-force recovery entirely once ANY camera's
                             # proximity accept succeeds, regardless of how weak it is or whether
                             # ANOTHER camera with real detected blobs this frame came up with nothing.
                             # Confirmed on a real recording (frame_range 800-900 relative frames
                             # 50/51/53): cam1 kept accepting 4-7-inlier proximity matches with several
                             # of its own detected blobs left unmatched, while cam0 -- which had its own
                             # real candidate blobs every one of those frames -- never got to
                             # independently confirm or contradict it, letting one weak, partially-wrong
                             # camera lock in the whole controller's fused pose frame after frame with no
                             # cross-check. Now, when every accepted camera's solution is "weak" --
                             # either its own inlier count < strong_match_inliers above, OR its
                             # inliers/available-blobs ratio is below this floor -- AND at least one
                             # other camera had real detected blobs but no accepted solution, that other
                             # camera also gets a brute-force cross-check this frame (appended to, never
                             # replacing, the already-accepted weak solution). 0.7 is empirically set:
                             # surveyed 1684 real accepted proximity solutions (walk_medium, 3000 frames)
                             # -- median ratio is 1.0 (most accepts use every detected blob), only 4.04%
                             # ever fall below 0.7 -- low enough to essentially never fire on a normal,
                             # healthy single-camera accept.
  score_error_floor_px: 0.5   # _inlier_discounted_error's error floor, used when comparing
                              # competing candidates (_resolve_cold_conflicts across
                              # controllers, _select_best_cam_solution across one
                              # controller's own cameras): errors below this are clamped
                              # to it before the inlier-count discount, so a difference
                              # like 0.06px vs 0.09px (blob-centroid noise, not a real
                              # quality signal) never outranks a candidate with genuinely
                              # more corroborating total_pairs -- only a difference that
                              # survives above this floor still decides the score.
                              # Defaults to strong_match_error_px's value but is kept
                              # independently tunable (omit to just track that value).
  min_vis_coverage: 0.6
  brute_aux_reprojection_threshold_px: 2.0   # aux-camera Hungarian match threshold for cross-camera
                                              # coverage gating (brute_search_tier's aux block); kept
                                              # separate from joint_aux_prefilter_px (unrelated
                                              # joint-LM/snap_camera mechanism) so the two can be
                                              # tuned independently.

  # edge_confidence_*/edge_reproj_widen_max: how much to distrust a point the
  # closer it sits to a KB4 camera's own rpmax_px boundary (see camera.
  # radial_taper_weight's own docstring for the full derivation) -- found
  # 2026-09-13 investigating a real coverage_fallback case (right_controller
  # frame 63): 5 real, correctly-detected cam3 blobs sat at 92-98% of cam3's
  # own rpmax_px (the literal corner of the frame), none matching a flat
  # 2.0px aux-reprojection threshold that was implicitly calibrated against
  # center-of-frame accuracy -- dragging balanced_coverage to 0.59, just
  # under the 0.6 floor, despite cam1 (primary) and cam0 (aux) both being
  # individually strong. Checked all 4 cameras' live calibration: every one
  # has rpmax_px measurably smaller than its own image-corner distance, so
  # this is a structural property of the wide-FOV KB4 fit (less-constrained,
  # less-accurate calibration near its own validity boundary), not specific
  # to cam3.
  #
  # inner_fraction (shared by both uses below): full trust up to this
  # fraction of rpmax_px, then tapers/widens linearly out to rpmax_px
  # itself.
  #
  # confidence_floor: the balanced_coverage LED/blob weighting (brute_
  # search_tier, both the primary-camera and aux-camera weight arrays) gets
  # a SECOND, independent multiplicative discount alongside the existing
  # cos(theta) grazing-angle weight -- a point at/beyond rpmax_px keeps this
  # fraction of its facing-weight instead of being either fully trusted or
  # hard-gated by the flat aux reprojection threshold alone.
  #
  # reproj_widen_max: proximity-tracking's own RANSAC reprojection threshold
  # (proximity_reprojection_threshold below) gets multiplied by up to this
  # much for a call whose worst (closest-to-boundary) matched blob sits at
  # rpmax_px -- a WIDEN rather than a discount, since _ransac_pnp (src/
  # _pnp.py) takes one plain scalar threshold per call and is deliberately
  # NOT touched here (per-point tolerance inside RANSAC isn't achievable
  # without replacing OpenCV's own solver -- explicitly out of scope).
  #
  # All three are first-cut, physically-motivated defaults -- not yet fit
  # against real radius-binned residual data the way e.g. pose_jump_pred_
  # pos_thresh_base_mm was (CONTROLLER_TRACKER_JUMP_STATS_CSV, src/
  # controller.py) -- revisit if this needs tightening later.
  #
  # reproj_widen_abs_cap_px: 2026-09-13 critical review found the multiplier
  # alone unsafe -- proximity_reprojection_threshold's own live value here
  # (2.5px) * edge_reproj_widen_max (2.5x) reaches 6.25px, looser than every
  # one of this project's brute-force thresholds (1.5-2.0px), contradicting
  # proximity_reprojection_threshold's own comment ("tighter than brute --
  # prior is already close"). This caps the WIDENED value regardless of the
  # multiplier; _edge_widened_thresh (src/pose_search.py) never returns
  # narrower than the call's own base threshold either. Same fix also scopes
  # the widen decision to only the NEW/not-yet-verified pairs a proximity
  # RANSAC call is testing (hyp_pairs), never pairs already locked in from a
  # prior frame -- a stale locked pair drifted near the edge must not widen
  # tolerance for an unrelated, brand-new, center-of-frame candidate pair.
  #
  # This same taper/cap is also reused (still gated by inner_fraction/
  # reproj_widen_max/reproj_widen_abs_cap_px above) as a COVERAGE-ONLY soft
  # credit in brute_search_tier's aux-camera loop: a near-miss blob that
  # fails the flat/unwidened brute_aux_reprojection_threshold_px hard gate
  # but falls within the radially-widened soft tolerance still pulls led_cov
  # up a little, but is never written into aux_assignments/extra_inlier_
  # count -- those feed cross-controller conflict resolution/tie-breaking
  # (src/controller.py) and brute-force's own best-hypothesis comparison, so
  # a false aux MATCH there is far more consequential than a coverage nudge;
  # widening the hard gate itself was considered and rejected for this
  # reason.
  edge_confidence_inner_fraction: 0.8
  edge_confidence_floor: 0.3
  edge_reproj_widen_max: 2.5
  edge_reproj_widen_abs_cap_px: 3.5
  brute_redundancy_ref: 6   # same "extra inlier pairs beyond the 3-point minimal fit needed for
                             # full redundancy trust" idea as proximity_redundancy_ref below, but
                             # its own independent knob -- brute-force's committed solution's
                             # confidence uses this against n_ransac_verified (pure RANSAC-survivor
                             # count, pre post-RANSAC-recovery/pre-aux-pooling), not proximity's own
                             # tuning value, so retuning one search mode never silently moves the other.
  rng_seed: 42

  # --------------------------------------------------------------------------
  # Proximity match
  # --------------------------------------------------------------------------
  use_proximity_match: true              # set to false to always use brute force
  proximity_min_inliers: 4               # min inliers for proximity match — kept at the brute-force floor;
                                          # 3 is a zero-redundancy PnP fit (6 DOF, 2 eqns/point) whose error
                                          # can look deceptively perfect regardless of correctness
  proximity_redundancy_ref: 6            # extra inlier pairs beyond the 3-point minimal fit needed for full
                                          # fusion-weight confidence: confidence_factor = clip((n_inliers-3)/this, 0, 1)
                                          # — a 4-point fit (1 extra) is barely trusted, 9+ points (6 extra) is fully trusted
  proximity_reprojection_threshold: 2.5  # RANSAC threshold (tighter than brute — prior is already close)
  proximity_expansion_px: 5.0           # neighbourhood radius (px) per LED; velocity-scaled: gate = base + k * v_px
  proximity_max_hypotheses: 32          # cap on valid hypothesis evaluations before best-so-far is accepted
  proximity_none_penalty_px: 0.4        # px cost for the first unmatched LED
  proximity_none_penalty_factor: 1.5    # geometric growth per None level: k-th None costs penalty * factor^(k-1); 1.0 = flat (linear)
  proximity_strong_match_px: 0.5        # 0-None hypothesis below this error triggers early termination
  proximity_branch_k: 2                 # top-K hypotheses per None level to branch from at the next level
  proximity_none_branch_width: 4
  proximity_level0_max_hyp: 8
  proximity_topk_max_pop: 8000           # safety cap on heap pops in the best-first fallback combo search
                                          # (_bt_combos_topk) before giving up on this None level and moving
                                          # to the next; sized from profiling two_ctrl/3_very_fast_moves_bad_vissibility:
                                          # the two cases that actually paid off (got accepted) needed <=7093
                                          # pops, while cases needing >17000 were rejected downstream anyway
                                          # (severe ambiguity -- locked=0, 13+ candidate LEDs -- essentially
                                          # never resolves via proximity match, brute-force gets there faster)
  proximity_max_estimated_combos: 5000000  # gate checked BEFORE any combo search runs: raw (pre-collision-
                                          # pruning) combo-space size estimate = comb(len(hyp_k), n_assigned)
                                          # * geomean(hyp_sizes)^n_assigned, where n_assigned = len(hyp_k) -
                                          # min_none_forced. Above this, proximity match is skipped entirely
                                          # (return None -> falls through to brute-force, which already
                                          # triggers automatically whenever proximity finds nothing) instead
                                          # of paying for a doomed best-first search. Calibrated against
                                          # two_ctrl/3_very_fast_moves_bad_vissibility: the real pathological
                                          # case (13 LEDs, locked=0) estimates ~2.3B and never resolved via
                                          # proximity anyway; known-good real cases (10-12 LEDs, moderate
                                          # density) estimate <=1M, comfortably under this cap.
  proximity_score_metric: "mean"        # error metric used when scoring hypotheses: "max" or "mean"
  proximity_top_k_ransac: 3
  proximity_stage2_max_err_factor: 4.0  # skip stage-2 RANSAC rescoring when best ITERATIVE err > this × accept_error_px (too few points for RANSAC to rescue a fit that far off)
  visibility_occlusion_margin_m: 0.02   # penetration depth (m) at which body/frustum occlusion score reaches 0; 0 = hard binary
  proximity_vis_score_threshold: 0.95   # include LEDs with vis score >= this in proximity search (catches borderline edge cases)

  proximity_expansion_velocity_k: 0.1   # extra px per px/(reference frame) of estimated velocity
  # Fixed period used to convert vel_ema (a genuine m/s rate) into the
  # "px/frame" scale proximity_expansion_velocity_k was tuned against. NOT the
  # frame's own actual dt_target -- this recording's frame rate oscillates
  # (e.g. 30/60fps), and using the real variable dt_target here made the
  # velocity-scaled margin swing ~2x in sync with that cadence for identical
  # real hand speed (see cheap_search_core's own comment on this fix). 1/30s
  # is a first-cut default (the slower of the two observed cadences) -- if the
  # neighbourhood still feels mis-sized after this fix, retune this value
  # (and/or proximity_expansion_velocity_k) against this recording's actual
  # typical speed range, not dt_target.
  proximity_expansion_velocity_ref_dt_s: 0.0333
  proximity_expansion_uncertainty_k: 1.0  # extra px / n_history; largest at n=1 (2nd frame), decays as 1/n
  proximity_expansion_depth_k: 2.0        # extra px * m of depth; same pattern as local_search_depth_k — closer controller → bigger neigh

  # --------------------------------------------------------------------------
  # Pose prediction
  # --------------------------------------------------------------------------
  pose_history_window: 3             # max poses kept for _predict_pose; 1=constant pos, 2=const vel, 3+=linear fit
  pose_prediction_weight_decay: 0.7  # exponential weight decay per frame (0→only last frame, 1→equal weights)
  pose_prediction_vel_ema_beta: 0.7  # EMA weight on newest velocity step (0=frozen, 1=no smoothing)
  pose_gap_velocity_warmstart_frames: 2
  tracking_lost_grace_frames: 1      # consecutive lost frames a controller may warm-retry (via
                                      # surviving pose_history) before prev_pose/pose_history are
                                      # cleared and it must cold-start; 1 = exactly one retry
  # Real elapsed time (seconds) since the fusion filter's last ACCEPTED
  # vision update -- while under this, ControllerTracker._mark_all_lost keeps
  # every camera's pose_history warm via pure IMU dead-reckoning
  # (HeuristicPoseFusionFilter/PoseFusionFilter.predict()) instead of
  # freezing at the last vision-confirmed pose -- keeps the search
  # neighbourhood centered near where the controller actually is during a
  # short occlusion/missed-detection/rejected-reacquisition gap. Requires
  # fusion.enabled + imu.enabled and a converged g_world -- fails open (old
  # grace-then-clear behavior) otherwise. "Resets" the instant vision accepts
  # a real candidate again, simply because that advances last_update_ts_ns
  # (no separate counter to reset).
  #
  # TIME-based (2026-09-09), not frame-COUNTED -- was
  # imu_only_propagation_max_frames=4 until this recording's own oscillating
  # frame rate (alternates ~11ms/~22ms) was found producing a real
  # discrepancy: CameraTracker.finalize_search's own cold-start-widening
  # check (below, cold_start_stale_max_speed_m_s etc.) already used REAL
  # elapsed time (last_good_pose_ts_ns), so a frame-counted budget here and a
  # time-based tolerance there could disagree about "how stale is this" for
  # the exact same loss streak -- e.g. a log reporting
  # "consecutive_failures=9, budget=4" told you nothing about how that
  # related to the widened tolerance's own seconds-based number. Converted to
  # seconds so BOTH mechanisms read off the identical clock
  # (last_update_ts_ns / last_good_pose_ts_ns, set together on every real
  # accept) with no unit mismatch possible. 0.066s = 4 * 16.5ms, this
  # recording's own average frame period (any 4 consecutive frames of a
  # clean ~11/~22ms alternation sum to exactly 66ms regardless of phase) --
  # chosen to preserve the old default's real-world behavior almost exactly,
  # not a re-derived "how long is IMU actually reliable for" number (that
  # horizon is far longer, see HeuristicPoseFusionFilter's own docstring --
  # this budget was always deliberately conservative relative to it).
  imu_only_propagation_max_s: 0.066

  # ControllerTracker._mark_all_lost's own accel/gyro-aware shrink of the
  # budget above -- same mechanism/question as
  # fusion_heuristic.coast_trust_* (see that block's own comment for the
  # fit, and for coast_trust_min_budget_s's own 2026-09-14 revision from
  # 0.011 to 0.025 -- caught right here: a single ordinary lost frame
  # (left_controller, this recording, frame 57) at peak_gyro_dps=1564.6 --
  # fast but ordinary hand rotation -- floored the old 0.011s budget below
  # this frame's own real 22.2ms gap, showing no IMU-only pose at all
  # through one perfectly normal lost frame), reused here unchanged since
  # it's the same underlying "is IMU-only dead-reckoning still credible
  # right now" question at a different layer (a genuine no-candidate-at-all
  # loss here, vs. a buffered weak candidate there) -- the fit came out
  # naturally shareable, not two separately re-derived numbers.
  coast_trust_accel_calm_floor_mps2: 0.0
  coast_trust_gyro_calm_floor_dps: 0.0
  coast_trust_shrink_s_per_mps2: 0.001145
  coast_trust_shrink_s_per_dps: 0.000058
  coast_trust_min_budget_s: 0.025
  # --------------------------------------------------------------------------
  # Pose validation
  # --------------------------------------------------------------------------
  accept_error_px: 1.5                          # max mean reprojection error to accept any solution
  # pose_jump_pos/rot_thresh_base (below) -- HISTORY: originally a flat
  # per-axis budget. TIGHTENED 2026-09-06 (position) from [0.25,0.25,0.30]
  # to [0.18,0.18,0.20], empirically retuned against walk_medium (5546 real
  # predicted(prev_pose)-vs-actual position-diff samples, 2536 quality-
  # filtered: n_inliers>=8, error_px<=0.8) via CONTROLLER_TRACKER_JUMP_
  # STATS_CSV (src/controller.py): quality-filtered residuals reached
  # p50=15mm p90=36mm p95=43mm p99=54mm p99.5=59mm max=70mm; re-verified
  # zero new false-rejects under the actual OR-logic (accept if EITHER
  # prev_pose OR predicted_pose check passes). Rotation LEFT at a flat
  # 30deg that same pass (quality data only reached p99.5=22.6deg/
  # max=26.4deg on that walking-pace recording) -- but found TOO TIGHT
  # 2026-09-13 on a real "hard" (near-maximum-effort fast hand motion)
  # recording, needing a live bump to 60deg to stop false-rejecting
  # genuine fast motion.
  #
  # TIME-SCALED 2026-09-13: rather than re-flattening at a new constant
  # that would eventually prove wrong again for some other motion speed,
  # this is now base + max_plausible_hand_speed_m_s/_ang_speed_deg_s
  # (below) * dt_s, where dt_s is REAL elapsed time since prev_pose's own
  # timestamp (not an assumed cadence) -- same "widen from t=0, no
  # baseline free pass" pattern already validated for the last_good_pose
  # widening below (see that key's own comment for why a baseline-then-
  # widen version was tried and found wrong on a real case). base values
  # are DERIVED, not re-picked from scratch: base = (the old, already-
  # validated flat value) - shared_rate * 0.022s (this recording's own
  # typical frame gap -- the timescale both the 2026-09-06 walk_medium fit
  # AND the 2026-09-13 30->60deg hard-recording finding were tuned
  # against), so the new formula reproduces the already-validated number
  # at that reference cadence and scales properly for any other real gap
  # instead of staying flat:
  #   position: 0.18/0.18/0.20m - 3.0m/s*0.022s = 0.114/0.114/0.134m
  #   rotation: 60deg - 2000deg/s*0.022s ~= 15.6deg (all 3 axes, matching
  #     the old value's own uniformity)
  #
  # SCALAR (Euclidean distance / total rotation angle) 2026-09-13, same day
  # -- was still per-axis immediately above (each axis checked
  # independently), which the user caught producing an absurd asymmetry: a
  # candidate offset (563,36,31)mm -- Euclidean magnitude ~566mm -- got
  # REJECTED (x alone over its own axis budget), while one offset
  # (440,440,440)mm -- Euclidean magnitude ~762mm, i.e. MORE total real
  # displacement -- would have been ACCEPTED (every axis individually under
  # its own budget). Per-axis independence lets diagonal motion "hide"
  # arbitrary extra distance the check exists to catch. Matches the
  # project's own established precedent: matching.pose_jump_pred_pos_
  # thresh_base_mm (vs-predicted_pose, check 2) already treats POSITION as
  # a magnitude/scalar check for exactly this reason ("position (magnitude):
  # raw max-fit..." -- see that key's own comment) -- only ROTATION stayed
  # per-axis there, because real per-axis empirical data showed genuinely
  # different noise per rotation axis (y noisier than x/z). No such
  # per-axis empirical backing exists for THIS check's numbers -- the base
  # values above were already uniform (rotation exactly, position within
  # ~15%), so nothing axis-specific is lost converting to scalar.
  #
  # Value = norm() of the per-axis values immediately above (0.114,0.114,
  # 0.134 -> 0.2096m; 15.6,15.6,15.6 -> 27.02deg) -- a deliberate first-cut,
  # not a re-derivation: this is the box's own corner-to-corner diagonal, so
  # it's guaranteed AT LEAST as permissive as the old per-axis box in every
  # direction (no new false-rejects vs. before), but is necessarily MORE
  # permissive along a single-axis-only direction than the tight per-axis
  # value was (that specific tightness is what caused the asymmetry, so
  # losing it here is the fix, not a regression) -- revisit via
  # CONTROLLER_TRACKER_JUMP_STATS_CSV for a properly re-derived scalar
  # radius later, the same way checks 1/2's own per-axis numbers were
  # originally derived.
  pose_jump_pos_thresh_base_m: 0.21   # scalar Euclidean-distance budget, at dt=0 -- vs prev_pose only
  pose_jump_rot_thresh_base_deg: 27.0  # scalar total-rotation-angle budget, at dt=0 -- vs prev_pose only
                                                  # (see pose_jump_pred_rot_thresh_base_deg below for the separate,
                                                  # much tighter vs-predicted_pose rotation bound added 2026-09-10)
  # vs-predicted_pose position AND rotation tolerance (CameraTracker.
  # finalize_search) are both VELOCITY-DEPENDENT instead of the fixed
  # per-axis pose_jump_pos_thresh_m/pose_jump_rot_thresh_deg above --
  # predicted_pose is a genuinely better estimator than prev_pose (velocity
  # extrapolation, plus real measured gyro integration for rotation -- see
  # CameraTracker._predict_pose's own docstring), so it deserves its own
  # tighter bound rather than reusing vs-prev_pose's.
  #
  # RE-DERIVED 2026-09-10 (rotation given its own threshold for the first
  # time -- previously it silently reused pose_jump_rot_thresh_deg above,
  # see git history) against the FULL walk_medium recording, not a
  # sub-range: 7295 quality-filtered samples (n_inliers>=8, error_px<=0.8,
  # same bar as the 2026-09-06 tuning) out of 13893 total, both controllers,
  # via CONTROLLER_TRACKER_JUMP_STATS_CSV (src/controller.py). Method: bin by
  # speed, take the real MAX residual per bin (not a percentile -- a
  # percentile under-covers by construction), fit a line through the bin
  # maxes, then margin the fit until it clears ALL 7295 quality samples with
  # zero false-rejects (re-verified row by row, not estimated from the fit
  # alone):
  #   position (magnitude): raw max-fit ~= 30.7 + 16.5*speed_m/s mm --
  #     needed a full 2x margin for zero false-rejects at this larger, more
  #     representative scale. IMPORTANT: the OLD 10+10 default (fit against
  #     a smaller sub-range sample) turned out to already be TOO TIGHT here
  #     -- it was silently false-rejecting 54/7295 (0.74%) of genuinely good
  #     frames on the full recording. This was a real, live miscalibration,
  #     not a hypothetical -- not every retune moves a threshold tighter.
  #   rotation x: raw max-fit ~= 6.5 + 0.42*speed deg, x1.3 margin.
  #   rotation y: raw max-fit ~= 8.7 + 0.98*speed deg, x1.4 margin (the
  #     noisiest axis -- also the one that let a real ~38deg fusion-level
  #     jump through completely undetected before this fix: with NO
  #     dedicated vs-predicted_pose rotation threshold, that check silently
  #     inherited vs-prev_pose's much looser flat 30deg/axis bound).
  #   rotation z: raw max-fit ~= 3.5 + 0.50*speed deg, x1.3 margin.
  # Checked and ruled out as confounds before trusting this fit: (a)
  # n_inliers within the quality set barely moves the residual tail (max at
  # n_inliers=8 vs 9-13 is ~13.3 vs ~13.2deg -- the >=8 gate already does the
  # real work, no extra inlier-count-based tightening justified); (b)
  # pose_history maturity (pose_history_window=3 below) does NOT explain the
  # outlier tail in general: 99% of quality samples are already at full
  # window depth, and the tiny immature (<3) subset has a LOWER max residual
  # (46mm) than the mature one (97mm) -- ruled out as the general
  # explanation, even though it was real for the one ~38deg case that
  # motivated re-deriving this in the first place.
  # self.vel_ema (position) is the SAME velocity estimate predicted_pose
  # itself was built from this frame -- not a separate estimate.
  pose_jump_pred_pos_thresh_base_mm: 61.5
  pose_jump_pred_pos_thresh_per_speed_mm_s: 33.0
  pose_jump_pred_rot_thresh_base_deg: [8.4, 12.1, 4.5]         # [rx, ry, rz] at speed=0
  pose_jump_pred_rot_thresh_per_speed_deg_s: [0.55, 1.37, 0.65] # [rx, ry, rz] per m/s
  # max_plausible_hand_speed_m_s / max_plausible_hand_ang_speed_deg_s: shared
  # "how far could a human hand plausibly have moved in this much real time"
  # rate. Consolidated 2026-09-13 (full audit of every jump-check in this
  # project) from THREE previously-independent, drifting numbers that all
  # answered this exact same question: pose_jump_pos/rot_thresh_base above
  # (vs prev_pose, now time-scaled from t=0 -- was flat), this cold-start/
  # last_good_pose widening (was cold_start_stale_max_speed_m_s/
  # _ang_speed_deg_s, a separate 720deg/s that was inconsistent with the
  # ~2000deg/s check 1 needed -- folded into this), and
  # HeuristicPoseFusionFilter's own bootstrap/cold-reacquire weak-pair
  # confirm check (fusion_heuristic section, pose_fusion_heuristic.py --
  # was a separate, ungrounded cold_confirm_max_speed_m_s=5.0, now retired).
  #
  # FOURTH consumer, added 2026-09-13 (turning-point-overshoot fix):
  # HeuristicPoseFusionFilter._implausible_jump_thresholds' own stale-time
  # widening term (elapsed seconds since last_update_ts_ns * this rate,
  # added to the ceiling on top of its existing |self.v|-scaled term) --
  # deliberately reuses these SAME two constants (fusion_cfg now threads
  # matching: through into that filter, see main.py's TrackingSystem
  # construction) rather than adding a FOURTH drifting copy of this exact
  # concept. Fixes a real reject cascade at a genuine motion reversal
  # (swing turning point): predict()'s dead-reckoning uses self.v as a
  # ONE-STEP-STALE initial velocity, overshooting past the reversal, and
  # each subsequent rejected frame's growing elapsed time (last_update_ts_ns
  # doesn't advance on a reject) compounded the divergence further every
  # frame -- see that method's own docstring for the full real trace.
  #
  # Once a loss runs longer than imu_only_propagation_max_s (same clock,
  # same units -- see that key's own comment), predicted_pose goes
  # stale/unavailable and only last_good_pose (frozen at the last real
  # vision accept) is left; this rate widens ITS threshold per additional
  # elapsed second past that point.
  #
  # RE-DERIVED 2026-09-13 (accel/gyro-aware jump-threshold audit, user-
  # directed) from real CONTROLLER_TRACKER_JUMP_STATS_CSV data across BOTH
  # available recordings (walk_medium AND walk_hard, not walk_medium alone
  # as the previous 3.0/2000.0 values effectively were) -- 10113 real
  # per-camera warm-frame rows, quality-filtered to n_inliers>=6/error_px<=
  # 0.5 (this project's own "strong_match" bar) to exclude weak/degenerate
  # solves whose own large position/rotation delta is solve noise, not real
  # motion (confirmed by inspecting the largest raw outliers before this
  # filter: n_inliers 4-9, error_px up to 7.4px; after filtering, the
  # largest outliers instead pair low error_px with genuinely high measured
  # peak_gyro_dps/peak_accel_mps2 -- real violent motion, not noise).
  #
  # Position: 99.9th-percentile speed_est_m_s (real per-frame |Δp|/dt from
  # accepted solves) across the filtered set was 6.99 m/s -- found by
  # investigating a real case where 3 mocap-confirmed-CORRECT vision
  # candidates got rejected as "implausible" during a genuine ~14g/~2900deg/s
  # swing in walk_hard; the OLD 3.0 m/s cap sat below even walk_medium's own
  # p90 raw speed (3.3-3.8 m/s), let alone walk_hard's. 7.5 m/s keeps a small
  # margin above the fitted 6.99.
  #
  # Rotation: 99.9th-percentile of rot_diff_prev_deg/dt_prev_s (real
  # per-frame angular rate) across the filtered set was 2034.8 deg/s --
  # close to the old 2000 (that one was already reasonably placed, per its
  # own prior research-grounded derivation below); 2200 keeps a small margin
  # above the fitted value the same way position's does.
  #
  # Prior research-grounded cross-check (still holds): isolated wrist-flick
  # studies alone only support 300-700deg/s (https://pmc.ncbi.nlm.nih.gov/
  # articles/PMC4689593/), well under this -- but that's ISOLATED wrist
  # rotation, not a full wrist+forearm(+shoulder) VR swing/slash gesture,
  # which uses the same kinetic-chain effect that gets OTHER fast human
  # motions (elite pitcher shoulder internal rotation ~7500deg/s,
  # finger-snap ~7800deg/s -- https://www.syfy.com/syfy-wire/finger-
  # snapping-acceleration-is-the-fastest-motion-in-humans) into the
  # thousands-of-deg/s range.
  max_plausible_hand_speed_m_s: 7.5
  max_plausible_hand_ang_speed_deg_s: 2200.0

  # --------------------------------------------------------------------------
  # Joint multi-camera optimisation
  # --------------------------------------------------------------------------
  # (joint_optimization / joint_primary_weight removed: every camera now searches
  # independently and fuse_camera_poses() always fuses whoever solved — no on/off
  # toggle, no "primary" bias, all cameras weighted by pair count x confidence.)
  joint_huber_scale: 1.5           # Huber loss threshold in pixels; residuals beyond this are soft-capped
  joint_aux_prefilter_px: 2.0      # drop aux pairs with reprojection > this before joint LM
  joint_lm_max_nfev: 50            # hard cap on residual evaluations; no analytic jacobian, so each TRF
                                    # iteration costs ~7x this (1 baseline + 6 finite-diff perturbations)
  joint_lm_ftol: 0.001            # TRF convergence tolerances (cost/param/gradient); looser = fewer
  joint_lm_xtol: 0.001            # iterations before "converged", at the expense of solution precision.
  joint_lm_gtol: 0.001            # 1e-4 verified numerically equivalent to 1e-7 at pixel-level precision.
  # fuse_camera_poses() fallback: when the joint LM fit is BOTH this many
  # times worse than the best individual camera's own solo error AND this
  # many px in absolute terms, trust that single camera's own solve instead
  # of the joint one -- a large joint/solo blowup is evidence the cameras
  # aren't looking at consistent geometry (e.g. a mismatched LED
  # correspondence), not noise a joint fit should average out. Found on a
  # real case: two cameras solved to ~1.1-1.25px each independently, joint
  # LM only reached 4.05px (~3.5x worse than either input alone).
  joint_fusion_max_error_ratio: 2.0
  joint_fusion_fallback_min_abs_px: 1.0

  # --------------------------------------------------------------------------
  # Cross-controller occlusion
  # --------------------------------------------------------------------------
  cross_controller_occlusion: true        # mask LEDs of controller B that are occluded by controller A's body
  cross_occlusion_bounding_radius_m: 0.18  # controller body bounding sphere radius (tune manually)
  cross_occlusion_gate_margin_px: 20.0     # slack added to the 2D projection gate threshold
  min_controller_center_distance_m: 0.05   # hard floor on distance between any two controllers'
                                            # fused pose centers (world frame); two rigid controllers
                                            # cannot occupy the same space. Deliberately smaller than
                                            # cross_occlusion_bounding_radius_m*2 (0.36m) -- that value
                                            # is a conservative bound meant to gate an expensive raycast,
                                            # not a literal collision radius; this check should only
                                            # fire on genuine degenerate/merged poses (near-zero
                                            # separation), not on controllers legitimately held close
                                            # together (e.g. clapping motion).

self_calibration:
  enabled: false                  # set to true to enable online intrinsic calibration
  primary_camera: 1               # camera used as 3D reference (its T_imu_cam is the anchor); when enabled,
                                   # this camera is also pinned as the tracker's fixed primary camera every
                                   # frame (no auto-select) — the self-cal feed only fires on frames where
                                   # this exact camera produced the solve, so it needs to be an actual anchor,
                                   # not just whichever camera happened to win auto-select that frame
  aux_cameras: [3]                # cameras to calibrate; null = all non-primary cameras
  optimize_params: [fx, fy, cx, cy, k1, k2, k3, k4]  # subset of: fx fy cx cy k1 k2 p1 p2 k3 k4 k5 k6
  min_primary_error_px: 0.5       # only accept frames with primary PnP error below this
  min_primary_inliers: 4          # minimum PnP inliers for a frame to be accepted
  plots_dir: "./data/cameras/"    # directory where self_cal_cam{N}.png plots are saved

debug:
  calibration_csv: null # "./data/calib_warm_pass1.csv"   # path to write threshold calibration data, e.g. "./data/calib_thresholds.csv"
  pose_csv: "./data/pose_log_2765frames.csv"   # null = disabled; per-accepted-frame (timestamp_ns, ctrl_name, quat, position)
                                      # in vision's own T_world_ctrl -- temporarily on for compare_vision_mocap.py
  vision_pose_csv: "./data/vision_pose_log.csv"  # null = disabled; per-frame (any frame with a vision
                                      # candidate, accepted OR rejected), (timestamp_ns, ctrl_name, quat,
                                      # position, confidence, error_px) in the RAW vision solve, unaffected
                                      # by fusion.enabled -- unlike pose_csv above, which becomes the
                                      # FUSED/corrected pose once fusion is on. confidence/error_px are the
                                      # SAME quality signals PoseFusionFilter's own gate uses (see
                                      # _meas_pos_sigma_m) -- needed so visualize_pose_fusion.py's offline
                                      # replay reconstructs the same accept/reject behavior the live run
                                      # actually had, not an artificially stricter one from assuming
                                      # confidence=1.0 always. Cheap (reuses solution["vision_T_world_ctrl"]/
                                      # ["confidence"]/["error"], already computed unconditionally -- no
                                      # extra IMU work, so this doesn't slow the live run down).
  led_detections_csv: "./data/led_detections_2765frames.csv" # null = disabled; per-accepted-frame, per-camera,
                                      # per-LED RAW 2D observations (timestamp_ns, camera_id, ctrl_name, led_id,
                                      # pixel_x, pixel_y, blob_radius_px, brightness) -- the pre-PnP-solve
                                      # point-level data a bundle-adjustment-style external tool (e.g. Basalt)
                                      # needs and can't recover by working backward from pose_csv's already-solved
                                      # 6-DOF pose. One row per LED actually matched THIS frame, across ALL
                                      # cameras that contributed to the accepted solve (primary via sol["assignment"]
                                      # + every aux camera via sol["aux_assignments"][cam_idx]), not just the
                                      # primary camera -- unlike debug.calibration_csv above, which is primary-only.
                                      # led_id is the resolved LED identity (tracking_system's post-match assignment),
                                      # not a raw per-frame blob index, so a given LED's 2D track can be followed
                                      # across frames. camera_id is the internal 0-based index (matches
                                      # data.selected_cameras / the cam{idx} on-disk folder before
                                      # data.controller_cam_start_index is applied), same convention
                                      # debug.calibration_csv's cam_idx column already uses.
  algorithm_log_dir: null   # e.g. "./data/algorithm_log"  # dir to write <ctrl_name>_algorithm_log.csv
                             # (basalt_controller_mocap_calib --algorithm-log-csv input: per-frame
                             # T_Ih_Ic(t), one file per enabled controller). Rotation uses
                             # src.imu_data._DIAG_FLIP (resolved 2026-09-02 -- see the comment above
                             # _algo_log_T_ref_ic in main.py); the old algorithm_log_rt_transpose
                             # option is gone, that ambiguity no longer exists.
  mocap_log_dir: null   # e.g. "./data/mocap_gt"  # dir to write <ctrl_name>_mocap_gt.csv (one row per
                         # processed frame, T_headsetImu_ctrlImu(t) ground truth from mocap.enabled's
                         # loaded trajectories — see src/mocap_data.py); requires mocap.enabled: true and
                         # both the headset's and that controller's mocap_calib_path set
  assume_continuous_frames: true  # true = input is a real continuous capture (frame N+1 is ~one exposure
                                    # after frame N) → the pose-continuity jump check on re-acquisition
                                    # applies. false = input is a curated/isolated set of problem frames
                                    # (e.g. harvested via split_to_folders below) with no temporal relation
                                    # to each other → that check is skipped, since "did the pose jump
                                    # implausibly far since last frame" is meaningless when there's no real
                                    # "last frame". NOT console verbosity — that's entirely controlled by
                                    # the log_* flags below, independent of this setting.
  split_to_folders: false

  # --------------------------------------------------------------------------
  # Log categories — each toggles one slice of console output. Every one of
  # them false ⇒ nothing prints but the tqdm progress bar (warnings/errors are
  # the one exception: those always print, regardless of these flags).
  # --------------------------------------------------------------------------
  log_startup: true              # startup line (mode/data root), calibration CSV open/close paths
  log_frame_summary: true        # per-frame per-controller accept line (cam/err/matches/method), TRACKING LOST
  log_timings: false             # blob-detect / pose-search / rerun timings, slow-frame notices,
                                  # per-tier brute-force bench + P3P-call summaries -- pure perf/speed
                                  # noise (pool_rt=[...], "Brute tier_X bench: p3p=...gate=...", "update
                                  # timing: cheap=...", cold/warm detect ms), not tracking-decision info;
                                  # turned off 2026-09-14 (user request) to cut console noise during
                                  # investigation. Flip back to true for perf debugging specifically.
  log_blob_detection: true      # blob-dedup grouping (controllers sharing a camera collapse to one detect call)
  log_blob_diag: false          # per-call pool round-trip breakdown: dispatch latency / compute / return transit
                                  # -- same "pure speed noise" reasoning as log_timings above, off 2026-09-14.
  log_matching_decisions: true  # per-camera proximity/brute attempt, accept/reject, cold-start,
                                  # cold brute-force gating streak, warm-cam-cap candidate/demotion
  log_batch_orchestration: true # warm-batch/cold-batch round summaries, per-tier pool submissions
  log_pose_fusion: true         # per-camera importance weights in joint multi-camera fusion
  log_occlusion: true           # cross-controller occlusion masking, cold-cold conflict resolution
  log_proximity_match: true     # proximity/prior-constrained match internals: pairs matched, RANSAC
                                  # outcome, dropped/vis-dropped pairs, aux-camera snap, final accept
  log_hypothesis_testing: false  # brute-force per-hypothesis funnel: target triple reached, P3P solution
                                  # count, depth/gate/visibility checks (see triple filters below)
  log_ransac: false              # brute-force per-hypothesis Hungarian/RANSAC/aux-validation/coverage
                                  # stages and each new-best-solution update (see log_best below)
  log_self_calibration: false    # self-calibration frame accept/reject, per-camera optimisation results

  log_all_triples: false          # within log_hypothesis_testing/log_ransac: log every brute-force
                                  # hypothesis triple, ignoring the LED/blob triple filter below
                                  # (very verbose -- one block of prints per triple tried)
  log_all_proximity_hyps: false   # within log_proximity_match: log every candidate hypothesis tried
                                  # in the None-branching search (one line per combo), not just the
                                  # level/cap/early-stop/final-accept summary lines (very verbose)
  log_best: true                  # within log_ransac: log each new best solution update
  debug_led_ids: null # [4, 15, 17]            # e.g. [0, 14, 3]  — LED triple [anchor, l1, l2]
  debug_blob_ids: null # [0, 5, 4]          # e.g. [2, 5, 3]  — blob triple [b_anchor, b1, b2]

visualization:
  enabled: true  # set to false to skip Rerun entirely (no per-frame logging, no
                 # viewer, no .rrd file) — for isolating tracking-only speed;
                 # save_recording below only controls whether an enabled
                 # session also gets written to disk, not whether it runs at all.
  # Building the annotated per-blob debug canvas (drawing every kept/rejected
  # contour, legend strip, warm-mode tile grid) has a real per-frame CPU cost,
  # so it's only computed when one of these two sinks actually wants it:
  visualize_save:  false   # write canvases to ./visualization/blobs/*.png
  visualize_rerun: true   # log canvases into the Rerun stream/.rrd recording —
                           # this is what balloons recording file size
  3d_model_path: "./data/controllers/reverb_g2_controller_3d_model.stp"
  save_recording: "./visualization/recording.rrd"  # set to null to disable saving
  fine_tune_alignment: false  # set to true to run alignment optimiser and print refined params

  pose_fusion_debug:
    # Adds a "Pose Fusion" tab to the SAME Rerun recording (not a separate file/session):
    # per-controller vision-vs-fused-vs-IMU-only position/orientation charts, the dense
    # IMU-predicted trajectory (drawn in the 3D world view, growing across a reject
    # streak from the last accepted anchor), and PoseFusionFilter's internal Kalman/
    # trust state (d²/gate, confidence/comfort/trust, P-derived sigmas, innovation,
    # Kalman gain, consecutive_rejects, accept/reject/forced-cold-start events) — for
    # empirically tuning fusion:'s gates/weights against real behavior. See
    # src/pose_fusion.py's debug_snapshot()/predict_dense() and
    # src/visualization.py's _log_pose_fusion_debug(). Needs fusion.enabled: true to
    # have anything meaningful to show (a no-op when fusion is off, or when this
    # itself is off — the common case, since it adds real per-frame cost: an extra
    # dense IMU re-integration per controller per frame, see path_stride below).
    enabled: true
    path_stride: 4   # PoseFusionFilter.predict_dense's sample_every_n -- every Nth raw
                      # IMU sample along the dense dead-reckoned curve (3D world-view path
                      # only; the live rerun scalar charts show one point per camera frame
                      # regardless -- a per-sample-resolution live view was tried on a
                      # second "device_time" timeline and reverted: ~2x runtime cost for a
                      # sub-frame curve that still wasn't legible in the rerun viewer. Use
                      # visualize_pose_fusion.py instead for a proper zoomable per-sample
                      # HTML export, decoupled from the live tracking run entirely).
                      # Lower = smoother 3D path, higher per-frame cost (the integration is
                      # O(samples^2), see src/imu_data.py's dead_reckon_dense).

# Static-light (ceiling-lamp) exclusion -- mocap-grounded voxel-vote map, hard-excludes
# cold-start/brute-force blob candidates only (never the production warm-tracking
# proximity-search path). See guidance plan for the full design. `enabled: false` by
# default -- inert until wired into ControllerTracker.update (rollout phase 5); the
# offline-only keys below are already consumed by build_static_light_map.py.
static_light_exclusion:
  enabled: false
  map_path: "./data/static_light_maps/default.json"

  # ── Runtime application (cold-search filtering; not wired in yet) ──────────
  relax_margin_px: 20.0                # case-6 controller-occlusion relaxation slack
  controller_relax_bounding_radius_m: 0.18

  # ── Offline map-building only (build_static_light_map.py) ──────────────────
  warm_trust_threshold: 0.7            # both controllers' same-frame vision-solve confidence >= this
  claimed_blob_exclusion_px: 6.0       # survey blob within this of a claimed LED is dropped from U
  survey_required_threshold_factor: 1.0  # survey pass's required_threshold = min_threshold * this;
                                        # pixel_threshold (segmentation floor) is NEVER scaled down --
                                        # confirmed on real low-light footage that lowering it collapses
                                        # the whole frame into one rejected too-large blob instead of
                                        # separating real dim ones. Only the "must reach one truly bright
                                        # pixel" gate is relaxed (production uses required_threshold_factor
                                        # 2.0; 1.0 here = no extra brightness bar beyond segmentation itself).
  dim_blob_min_area_px: 2.0            # hardcoded floor for "too dim but big enough" reject-recovery
  voxel_size_m: 0.10
  min_votes: 30
  min_positional_spread_m: 0.15
  min_angular_spread_deg: 15.0
  radius_margin_m: 0.05
  ray_max_range_m: 8.0
  ray_step_m: 0.05
  # cluster_merge_distance_m: omit to default to voxel_size_m * 2.35 (see
  # StaticLightVoxelAccumulator's own docstring) -- two confirmed voxels for
  # the SAME physical fixture can triangulate more than one voxel-step apart
  # (confirmed on real data: 0.2236m gap, beyond 26-adjacency's 0.173m max),
  # so cluster merging is a plain Euclidean distance test on voxel centers,
  # not grid adjacency. Only override if a future recording's real fixtures
  # sit closer together than ~0.245m (the nearest observed distinct-feature
  # gap in this dataset) and get wrongly merged.

  # max_confirmed_median_reproj_resid_px: 0.0 = disabled (default). build_static_light_map.py
  # only -- for each confirmed cluster, reprojects its fitted 3D centroid into every
  # contributing frame and compares against where the blob was actually detected there;
  # a coincidental (non-physical) accumulation scatters across many unrelated detections
  # that happened to land in the same coarse voxel, so its median residual is much larger
  # than a real point's. Session diagnostic on one real recording found real lamps at
  # 13-22px median residual vs. one clearly-spurious candidate at 67px -- 40.0 cleanly
  # separated them there, but this is ONE recording's numbers, not yet swept against the
  # full 8-recording dataset, so left disabled here; a second candidate in the same test
  # (median 20px, inside the real-lamp range) stayed AMBIGUOUS under this test despite
  # other evidence (raw-pixel brightness) suggesting it might also be spurious -- this
  # gate is a genuine, validated signal but not a complete answer on its own.
